pp1ppp/8/4p2Q/4P3/8/PPPP1PPP/RNB1KBNR b KQkq - 1 2"],["b8c6","r1bqkbnr/pppp1ppp/2n5/4p2Q/4P3/8/PPPP1PPP/RNB1KBNR w KQkq - 2 3"],["f1c4","r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 3 3"],["g7g6","r1bqkbnr/pppp1p1p/2n3p1/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 0 4"],["h5f3","r1bqkbnr/pppp1p1p/2n3p1/4p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR b KQkq - 1 4"],["g8f6","r1bqkb1r/pppp1p1p/2n2np1/4p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR w KQkq - 2 5"]],"s":"Compare this. White brings the queen out early, and Black develops while chasing it. White has wasted moves.","a":[],"k":[]},{"f":"r1bqkb1r/pppp1p1p/2n2np1/4p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR w KQkq - 2 5","m":[],"s":"The rules: a centre pawn, knights before bishops, castle early, don't move one piece twice without a reason, and keep the queen home for now.","a":[],"k":[]}],"king":[{"f":"r1bqk2r/ppp2ppp/2np1n2/2b1p3/2B1P3/2NP1N2/PPP2PPP/R1BQK2R w KQkq - 0 6","m":[],"s":"Your pieces are out. Now get the king out of the centre.","a":[],"k":[]},{"f":"r1bqk2r/ppp2ppp/2np1n2/2b1p3/2B1P3/2NP1N2/PPP2PPP/R1BQK2R w KQkq - 0 6","m":[["e1g1","r1bqk2r/ppp2ppp/2np1n2/2b1p3/2B1P3/2NP1N2/PPP2PPP/R1BQ1RK1 b kq - 1 6"]],"s":"Castling tucks the king behind three pawns and brings the rook toward the middle.","a":[],"k":["f2","g2","h2"]},{"f":"r1bqk2r/ppp2ppp/2np1n2/2b1p3/2B1P3/2NP1N2/PPP2PPP/R1BQ1RK1 b kq - 1 6","m":[],"s":"Leave those three pawns alone unless you have a clear reason. Every push opens a door for enemy pieces.","a":[],"k":["f2","g2","h2"]},{"f":"rn1qkbnr/ppp2p1p/3p2p1/4p3/2B1P1b1/2N2N2/PPPP1PPP/R1BQK2R w KQkq - 0 5","m":[],"s":"Now see what happens to a king left in the centre. This trap is called Legal's Mate.","a":[],"k":[]},{"f":"rn1qkbnr/ppp2p1p/3p2p1/4p3/2B1P1b1/2N2N2/PPPP1PPP/R1BQK2R w KQkq - 0 5","m":[["f3e5","rn1qkbnr/ppp2p1p/3p2p1/4N3/2B1P1b1/2N5/PPPP1PPP/R1BQK2R b KQkq - 0 5"]],"s":"White's knight takes on e5, leaving the queen on d1 to be captured. Black can't resist.","a":[],"k":[]},{"f":"rn1qkbnr/ppp2p1p/3p2p1/4N3/2B1 LESSONS.push(
  {id:"discovered", tag:"tactics", title:"Discovered attacks", sub:"Unmask a hidden attacker", min:6,
   body:`<p>A discovered attack happens when one piece moves out of the way and uncovers an attack from the piece behind it. You get two threats from a single move: one from the piece that moved, one from the piece behind.</p>
<p>The strongest version is a <b>discovered check</b>. Your opponent must answer the check, so whatever the moving piece attacks is usually lost.</p>
<p>Look for it whenever one of your pieces stands between your queen, rook or bishop and an enemy king or queen.</p>`, puzzles:[]},
  {id:"repertoire-white", tag:"opening", title:"Your opening as White", sub:"The Italian Game", min:7,
   body:`<p>You don't need many openings. One plan as White, played every game, saves time on the clock and gets you into positions you understand.</p>
<p>Play <b>1.e4 e5 2.Nf3 Nc6 3.Bc4</b>. Then build with c3, d3, castle, Re1 and the other knight to d2. Against other replies, keep the same habits: knights out, a pawn to d4 when it's safe, castle.</p>
<p>Avoid early adventures like Ng5 or Qh5 until you've learned the lines. A quiet, healthy position gives you more chances to punish your opponent's blunders.</p>`, puzzles:[]},
  {id:"repertoire-black", tag:"opening", title:"Your openings as Black", sub:"e5 against e4, d5 against d4", min:7,
   body:`<p>Against <b>1.e4</b>, play <b>1...e5</b>, then Nc6, Bc5 or Be7, Nf6 and castle. Watch f7 every move until you've castled: that's where Scholar's Mate and Fried Liver attacks land.</p>
<p>Against <b>1.d4</b>, play <b>1...d5</b>, then e6, Nf6, Be7 and castle. If White plays the London (Bf4), hit the centre with ...c5.</p>
<p>The aim isn't to win in the opening. It's to reach move 10 with your pieces out, your king safe, and plenty of time on the clock.</p>`, puzzles:[]},
  {id:"kr-mate", tag:"endgame", title:"Mating with a rook", sub:"King and rook against king", min:6,
   body:`<p>King and rook against king is a forced win, but you need the method. Use the rook to cut the enemy king off on a rank or file, then walk your king up.</p>
<p>When the kings face each other with one square between them, check with the rook to push the king back one more row. Repeat until it's on the edge, then mate along the edge.</p>
<p>If the enemy king attacks your rook, move the rook to the far side of the board, staying on the same line.</p>`, puzzles:[]},
  {id:"pawn-endings", tag:"endgame", title:"King and pawn endings", sub:"King in front, and the rule of the square", min:6,
   body:`<p>With king and pawn against king, get your king <b>in front</b> of your pawn. Pushing the pawn with the king behind it usually only draws.</p>
<p>To check whether a king can catch a passed pawn, picture a square with one side running from the pawn to its promotion square. If the king can step into that square on its move, it catches the pawn. If not, the pawn queens.</p>`, puzzles:[]},
  {id:"converting", tag:"endgame", title:"Converting a won game", sub:"Trade down and push passed pawns", min:5,
   body:`<p>Lots of games at 800 to 1000 are won on material and then lost on tricks. When you're ahead:</p>
<ul><li><b>Trade pieces, not pawns.</b> Every trade makes your extra material count for more.</li><li><b>Push passed pawns</b>, with your king close by.</li><li><b>Keep blunder-checking.</b> Being ahead makes people relax, and that's when pieces get hung.</li><li><b>Mate, don't stalemate.</b> Give the lone king a square, or check it.</li></ul>`, puzzles:[]}
);

const Voice = {
  ok: typeof window.speechSynthesis!=="undefined" && typeof window.SpeechSynthesisUtterance!=="undefined",
  on: true, voice:null,
  pick(){ if(!this.ok) return; try{ const vs=speechSynthesis.getVoices(); this.voice = vs.find(v=>/en-(AU|GB)/i.test(v.lang)&&/natural|enhanced|premium/i.test(v.name)) || vs.find(v=>/en-AU/i.test(v.lang)) || vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }catch(e){} },
  spoken(t){ const N={K:"king",Q:"queen",R:"rook",B:"bishop",N:"knight"}; return t.replace(/\bO-O-O\b/g,"castles long").replace(/\bO-O\b/g,"castles").replace(/\b([KQRBN])([a-h1-8])?(x)?([a-h][1-8])(=[QRBN])?([+#])?/g,(m,p,d,x,sq,pr,c)=>`${N[p]}${x?" takes":""} ${sq}${pr?" promotes to "+N[pr[1]]:""}${c==="#"?", mate":c==="+"?", check":""}`).replace(/\b([a-h])x([a-h][1-8])([+#])?/g,(m,f,sq,c)=>`${f} takes ${sq}${c?", check":""}`).replace(/=Q/g," queens"); },
  unlock(){ if(!this.ok||!this.on) return; try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); }catch(e){} },
  say(text, rate){ return new Promise(res=>{ if(!this.ok||!this.on){ res(false); return; } try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(this.spoken(text)); if(this.voice) u.voice=this.voice; u.rate=Math.min(1.6,0.98*rate); let done=false; const fin=()=>{ if(!done){ done=true; res(true); } }; u.onend=fin; u.onerror=()=>{ done=true; res(false); }; speechSynthesis.speak(u); setTimeout(fin, 1500+text.split(/\s+/).length*440/rate); }catch(e){ res(false); } }); },
  stop(){ if(this.ok) try{ speechSynthesis.cancel(); }catch(e){} }
};

class LessonPlayer{
  constructor(el, scenes, {title="", onEnd}={}){
    this.el=el; this.scenes=scenes; this.i=0; this.playing=false; this.tok=0; this.speed=1; this.onEnd=onEnd; this.ended=false;
    el.classList.add("lp");
    el.innerHTML=`<div class="lp-stage"><div class="lp-board"></div><div class="lp-big" hidden><button class="lp-bigbtn" aria-label="Play lesson">${PLAY_SVG}</button><span>${esc(title)}</span></div></div>
      <div class="lp-cap" aria-live="polite"></div>
      <div class="lp-track">${scenes.map((_,k)=>`<button class="lp-seg" data-k="${k}" aria-label="Part ${k+1}"><i></i></button>`).join("")}</div>
      <div class="lp-ctl"><button class="btn small" data-c="prev" aria-label="Previous part">⏮</button><button class="btn small primary lp-pp" data-c="pp">Play</button><button class="btn small" data-c="next" aria-label="Next part">⏭</button><button class="btn small" data-c="show" hidden>Show me</button>
      <span class="lp-sp"><button class="btn small ghost" data-c="speed">1×</button>${Voice.ok?`<button class="btn small ghost" data-c="voice" aria-pressed="${Voice.on}">${Voice.on?"Voice on":"Voice off"}</button>`:""}</span></div>`;
    this.board=new Board($(".lp-board",el),{orientation:scenes[0]?.o||turnOrient(scenes), onMove:(f,t)=>this.answer(f,t)});
    this.cap=$(".lp-cap",el);
    $$(".lp-ctl [data-c]",el).forEach(b=>b.addEventListener("click",()=>this.ctl(b.dataset.c,b)));
    $$(".lp-seg",el).forEach(b=>b.addEventListener("click",()=>{ this.go(+b.dataset.k, this.playing); }));
    $(".lp-bigbtn",el).addEventListener("click",()=>{ this.play(); });
    this.show(0, false); $(".lp-big",el).hidden=false;
  }
  ctl(c,b){
    if(c==="pp") this.playing? this.pause() : this.play();
    if(c==="show"){ this.reveal(); return; }
    if(c==="prev") this.go(Math.max(0,this.i-1), this.playing);
    if(c==="next") this.go(Math.min(this.scenes.length-1,this.i+1), this.playing);
    if(c==="speed"){ this.speed = this.speed===1?1.5:this.speed===1.5?0.75:1; b.textContent=this.speed+"×"; }
    if(c==="voice"){ Voice.on=!Voice.on; b.textContent=Voice.on?"Voice on":"Voice off"; b.setAttribute("aria-pressed",Voice.on); try{ localStorage.setItem("bc-voice",Voice.on?"1":"0"); }catch(e){} if(!Voice.on) Voice.stop(); else if(this.playing) this.go(this.i,true); }
  }
  play(){ Voice.unlock(); $(".lp-big",this.el).hidden=true; if(this.ended){ this.ended=false; this.i=0; } this.playing=true; $(".lp-pp",this.el).textContent="Pause"; this.go(this.i,true); }
  pause(){ this.playing=false; this.tok++; Voice.stop(); $(".lp-pp",this.el).textContent="Play"; this.show(this.i,false,true); }
  destroy(){ this.tok++; this.playing=false; Voice.stop(); }
  ask(sc){ this.waiting=sc; this.board.opts.side=sc.q.side; this.board.setInteractive(true); $("[data-c=show]",this.el).hidden=false; this.wrong=0; }
  unask(){ this.waiting=null; this.board.setInteractive(false); $("[data-c=show]",this.el).hidden=true; }
  reveal(){ if(!this.waiting) return; this.unask(); this.i=Math.min(this.scenes.length-1,this.i+1); this.playing=true; $(".lp-big",this.el).hidden=true; $(".lp-pp",this.el).textContent="Pause"; this.go(this.i,true); }
  async answer(from,to){
    const sc=this.waiting; if(!sc) return;
    const fen=this.board.fen; const r=moveObj(fen, from+to+"q"); const c=r? new Chess(r.after):null;
    const uci=r? from+to+(r.m.promotion||"") : from+to;
    if(!r) return;
    this.board.set(r.after,{last:[from,to]});
    if(uci===sc.q.line[0] || c.in_checkmate()){
      this.unask(); this.board.flash("✓"); this.cap.textContent= c.in_checkmate()? "Checkmate. Well found!" : "Correct! Here's the full idea.";
      Voice.say(this.cap.textContent, this.speed); this.solved=(this.solved||0)+1;
      const tok=++this.tok; await sleep(1300); if(tok!==this.tok) return;
      this.i=Math.min(this.scenes.length-1,this.i+1); this.playing=true; $(".lp-pp",this.el).textContent="Pause"; this.go(this.i,true);
    } else {
      this.wrong++; this.board.flash("✕"); this.cap.textContent = this.wrong===1? "Not quite. Look again, or tap Show me." : "Still not it. Try once more, or tap Show me.";
      this.board.locked=true; await sleep(650); this.board.locked=false; this.board.set(fen,{animate:false});
    }
  }
  go(k, autoplay){ if(this.waiting) this.unask(); this.i=k; this.tok++; Voice.stop(); if(autoplay){ this.run(this.tok); } else this.show(k,false); }
  segs(){ $$(".lp-seg",this.el).forEach((s,k)=>{ s.classList.toggle("done",k<this.i); s.classList.toggle("cur",k===this.i); }); }
  show(k, animateMoves, keepEnd){
    const sc=this.scenes[k]; this.segs(); this.cap.textContent=sc.s; if(sc.o) this.board.setOrientation(sc.o);
    if(sc.q){ this.board.set(sc.f,{animate:false}); this.ask(sc); return; }
    const endFen = sc.m.length? sc.m[sc.m.length-1][1] : sc.f; const last=sc.m.length? [sc.m[sc.m.length-1][0].slice(0,2), sc.m[sc.m.length-1][0].slice(2,4)] : null;
    this.board.set(keepEnd? this.board.fen : endFen,{last: keepEnd? this.board.last : last, arrows:sc.a, marks:sc.k, animate:false});
  }
  async run(tok){
    const alive=()=>tok===this.tok && this.playing && document.contains(this.el);
    while(alive()){
      const sc=this.scenes[this.i]; this.segs(); this.cap.textContent=sc.s; if(sc.o) this.board.setOrientation(sc.o);
      if(this.board.fen!==sc.f) this.board.set(sc.f,{animate:false});
      else this.board.set(sc.f,{last:this.board.last, animate:false});
      if(sc.q){ this.board.set(sc.f,{animate:false}); Voice.say(sc.s, this.speed); this.ask(sc); return; }
      const speech=Voice.say(sc.s, this.speed);
      await sleep(500/this.speed); if(!alive()) return;
      for(const [u,f] of sc.m){ this.board.set(f,{last:[u.slice(0,2),u.slice(2,4)]}); await sleep(1050/this.speed); if(!alive()) return; }
      this.board.set(this.board.fen,{last:this.board.last, arrows:sc.a, marks:sc.k, animate:false});
      const words=sc.s.split(/\s+/).length; const minHold=Math.max(1800, words*330)/this.speed;
      const t0=Date.now(); const spoke=await speech; if(!alive()) return;
      const waited=Date.now()-t0; await sleep(Math.max(spoke? 700/this.speed : 0, (spoke?0:minHold-waited))); if(!alive()) return;
      if(this.i<this.scenes.length-1){ this.i++; }
      else { this.playing=false; this.ended=true; $(".lp-pp",this.el).textContent="Replay"; this.segs(); $$(".lp-seg",this.el).forEach(s=>s.classList.add("done")); this.onEnd&&this.onEnd(); return; }
    }
  }
}

/* ================= LESSON LIBRARY (generated from real game positions) ================= */
const KINDS = {

      "Checkmate ends the game no matter how much material you're down. In each position you're about to see, there's a forced mate. Look at every check first.",
      "These positions all end in checkmate. Count the enemy king's escape squares, then look for the check that covers them all.",
      "Kings get mated when their own pieces box them in. Watch how each mate uses a piece that's already close to the king."]},
  f:{name:"Forks", short:"Forks", tag:"tactics", intro:[
      "A fork is one piece attacking two targets at once. Your opponent can only save one. Look for squares where a piece hits the king and something valuable together.",
      "Forks win games at every level. Knights fork best, but queens, bishops, rooks and even pawns all do it. Watch for checks that also attack another piece.",
      "When two enemy pieces are a knight's jump, or a queen's line, from the same square, there may be a fork. These positions all have one."]},
  d:{name:"Discovered attacks", short:"Discoveries", tag:"tactics", intro:[
      "A discovered attack: one piece moves out of the way and unmasks an attack by the piece behind it. Two threats from one move.",
      "Look for your own pieces standing in front of your rooks, bishops and queen. Moving them with a threat can uncover a second, hidden attack."]},
  s:{name:"Skewers", short:"Skewers", tag:"tactics", intro:[
      "A skewer is a pin in reverse. You attack a valuable piece, it moves, and you win the piece behind it.",
      "Long-range pieces skewer along lines. When the enemy king and another piece share a rank, file or diagonal, look for a check."]},
  p:{name:"Pins", short:"Pins", tag:"tactics", intro:[
      "A pinned piece can't move without exposing something more valuable behind it. Attack pinned pieces: they can't run away.",
      "Pins freeze pieces in place. Once a piece is pinned to the king, pile up on it."]},
  h:{name:"Free pieces", short:"Free pieces", tag:"hanging", intro:[
      "The simplest way to win: take what's undefended. In each of these positions, your opponent has left something hanging. Find it before they fix it.",
      "Every move, scan your opponent's pieces and ask: is that one defended? These positions train exactly that habit."]},
  x:{name:"Sacrifices", short:"Sacrifices", tag:"tactics", intro:[
      "Sometimes the best move puts a piece where it can be taken. These sacrifices all win more than they give.",
      "A sacrifice gives material to get something bigger: a mating attack or a forced win of material. Calculate the forcing moves to the end."]},
  w:{name:"Winning material", short:"Combinations", tag:"tactics", intro:[
      "These positions all win material with a forcing sequence. Look at checks, captures and threats, in that order, and follow each one a few moves deep.",
      "Forcing moves first. Each of these positions has a sequence that leaves you ahead on material."]},
  q:{name:"Promotion", short:"Promotion", tag:"endgame", intro:["Pawns that reach the last rank become queens. These positions are about getting one there."]}
};
const KIND_ORDER=["h","f","m","p","s","d","x","w","q"];
const PN={K:"king",Q:"queen",R:"rook",B:"bishop",N:"knight",P:"pawn"};
const CN={w:"White",b:"Black"};
function pieceOn(fen, sq){ const p=fenPieces(fen)[sq]; return p? PN[p[1]] : "piece"; }
/* "Knight takes the rook on a8, check." */
function describeMove(fen, uci, opts={}){
  const r=moveObj(fen, uci); if(!r) return uci;
  const m=r.m, who=PN[m.piece.toUpperCase()]; const c=new Chess(r.after);
  let t;
  if(m.flags.includes("k")) t="castles kingside";
  else if(m.flags.includes("q")) t="castles queenside";
  else if(m.captured) t=`${who==="pawn"?"the pawn":"the "+who} takes the ${PN[m.captured.toUpperCase()]} on ${m.to}`;
  else t=`${who==="pawn"?"the pawn":"the "+who} goes to ${m.to}`;
  if(m.promotion) t+=` and becomes a ${PN[m.promotion.toUpperCase()]}`;
  if(c.in_checkmate()) t+=". Checkmate";
  else if(c.in_check()) t+=", with check";
  return {text:t, san:m.san, after:r.after, mate:c.in_checkmate()};
}
const cap1 = s => s.charAt(0).toUpperCase()+s.slice(1);
function motifSentence(p, fenAfterKey, fenBeforeKey){
  const kind=p[5], a=p[6];
  if(kind==="m") return a[1]==="backRank"? "It's a back-rank mate: the king is trapped behind its own pawns." : a[1]==="smothered"? "A smothered mate: the king is surrounded by its own pieces, and the knight delivers it." : "";
  if(kind==="f") return `That's a fork: the ${pieceOn(fenAfterKey,a[0])} on ${a[0]} attacks the ${pieceOn(fenAfterKey,a[1][0])} on ${a[1][0]} and the ${pieceOn(fenAfterKey,a[1][1])} on ${a[1][1]} at the same time.`;
  if(kind==="d") return `Moving off ${a[0]} uncovers the ${pieceOn(fenAfterKey,a[1])} on ${a[1]}, which now attacks the ${pieceOn(fenAfterKey,a[2])} on ${a[2]}. That's a discovered attack.`;
  if(kind==="s") return `The check is a skewer: once the king steps aside, the ${pieceOn(fenAfterKey,a[2])} on ${a[2]} behind it is exposed.`;
  if(kind==="p") return `It hits the ${pieceOn(fenAfterKey,a[1])} on ${a[1]}, which is pinned to the king on ${a[2]} and can't escape.`;
  if(kind==="h") return `The ${pieceOn(fenBeforeKey,a[0])} on ${a[0]} had no defenders. Free material.`;
  if(kind==="x") return `The piece can be captured on ${a[0]}, but it's a sacrifice that pays for itself.`;
  if(kind==="q") return `The pawn reaches the last rank and promotes.`;
  return "";
}
function resultSentence(p, side){
  const kind=p[5], a=p[6]; const gain = kind==="m"? null : a[a.length-1];
  if(kind==="m") return a[0]===1? "Mate in one." : `A forced mate in ${a[0]}.`;
  if(gain>=9) return `${CN[side]} ends up a queen's worth of material ahead.`;
  if(gain>=2) return `${CN[side]} comes out about ${gain} points ahead.`;
  return `${CN[side]} keeps the advantage.`;
}
function goalText(p){ const k=p[5]; if(k==="m") return p[6][0]===1? "Find mate in one." : `Find the mate in ${p[6][0]}.`; return "Find the best move."; }

/* group the puzzle set into lessons: band (100 points) × motif, 4 positions each */

  const groups={};

  const lessons=[]; const byId={};
  Object.keys(groups).sort().forEach(key=>{
    const [band,k]=key.split("-"); const list=groups[key].sort((x,y)=>x[0]<y[0]?-1:1);
    for(let i=0;i*4<list.length;i++){ const ps=list.slice(i*4,i*4+4); if(ps.length<2) continue; const id=`L${band}${k}${i+1}`; const L={id, band:+band, kind:k, n:i+1, ps}; lessons.push(L); byId[id]=L; }
  });
  return {lessons, byId, bands:[...new Set(lessons.map(l=>l.band))].sort((a,b)=>a-b)};
})();

function libScenes(L){

  L.ps.forEach((p,idx)=>{
    const ms=p[2].split(" "); const side=turnOf(p[1])==="w"?"b":"w";
    const opp=describeMove(p[1], ms[0]);
    sc.push({f:p[1], m:[[ms[0], opp.after]], s:`Position ${idx+1} of ${L.ps.length}. ${CN[side==="w"?"b":"w"]} has just played ${opp.san}: ${opp.text}. ${CN[side]} to play.`, a:[], k:[], o:side});
    sc.push({f:opp.after, m:[], s:`Your turn. ${goalText(p)} Make your move on the board, or tap Show me.`, a:[], k:[], o:side, q:{line:ms.slice(1), side}});
    let fen=opp.after;
    for(let j=1;j<ms.length;j++){
      const mine=j%2===1; const d=describeMove(fen, ms[j]); let s;
      if(mine){ s=`${cap1(d.text)}.`; if(j===1){ const ms2=motifSentence(p, d.after, fen); if(ms2) s+=" "+ms2; } }
      else s=`${CN[side==="w"?"b":"w"]}'s best reply: ${d.text}.`;

  const lp=L.ps[L.ps.length-1]; let ef=lp[1]; lp[2].split(" ").forEach(u=>{ const r=moveObj(ef,u); if(r) ef=r.after; });
  sc.push({f:ef, m:[], s:`Lesson complete. ${tip}`, a:[], k:[], o:turnOf(lp[1])==="w"?"b":"w"});
  return sc;
}
function suggestLessons(n, kinds){

  },
  renderLesson(col, id){
    const L=Library.byId[id]; if(!L){ Lessons.open=null; return Lessons.render(); }
    const same=Library.lessons.filter(x=>x.band===L.band&&x.kind===L.kind); const nx=same.find(x=>x.n===L.n+1) || suggestLessons(1,[L.kind])[0];
    col.innerHTML=`<button class="btn small ghost back" id="lBack">← Library</button>
      <div class="lhead"><span class="label">${L.band}–${L.band+99} · ${esc(KINDS[L.kind].name)}</span><h2 style="margin-top:4px">${esc(lessonTitle(L))}</h2></div>
      <div class="card" id="libP"></div>
      <div class="row" style="justify-content:space-between">${libDone(L.id)?`<span class="tag best">Lesson complete</span>`:`<span class="note">Finish the video to complete it.</span>`}${nx&&nx.id!==L.id?`<button class="btn primary" data-lib="${nx.id}">Next: ${esc(lessonTitle(nx))} →</button>`:""}</div>
      <p class="note">Positions from the Lichess open puzzle database: ${L.ps.map(p=>`<a href="https://lichess.org/training/${esc(p[0])}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(p[0])}</a>`).join(", ")}</p>`;
    $("#lBack").addEventListener("click",()=>{ Lessons.open=null; Lessons.tab="library"; Lessons.render(); window.scrollTo(0,0); });
    bindLib(col);
    Lessons.player=new LessonPlayer($("#libP"), libScenes(L), {title:lessonTitle(L), onEnd:()=>{ const P=Store.profile; P.libDone=P.libDone||{}; if(!P.libDone[L.id]){ P.libDone[L.id]=Date.now(); logEvent("l"); Store.save(); const s=col.querySelector(".note"); if(s&&/Finish the video/.test(s.textContent)) s.outerHTML=`<span class="tag best">Lesson complete</span>`; } }});
  }
};
function segHTML(cur){ return `<div class="seg" role="tablist" aria-label="Lessons"><button data-seg="road" aria-pressed="${cur==="road"}">Road to 1000</button><button data-seg="library" aria-pressed="${cur==="library"}">Library</button>${STANDALONE?`<button data-seg="masters" aria-pressed="${cur==="masters"}">Masters</button>`:""}</div>`; }
function bindSeg(root){ $$("[data-seg]",root).forEach(b=>b.addEventListener("click",()=>{ Lessons.tab=b.dataset.seg; Lessons.open=null; Lessons.render(); })); }

/* ---------- LESSONS ---------- */
const Lessons = {
  open:null,
  render(){
    const col=$("#lessonsCol"), P=Store.profile;
    this.player?.destroy(); this.player=null;
    if(this.open==="mine") return Path.renderMine(col);
    if(this.open && this.open.startsWith("lib:")) return LibraryView.renderLesson(col, this.open.slice(4));
    if(!this.open && this.tab==="library") return LibraryView.render(col);
    if(!this.open && this.tab==="masters" && STANDALONE) return MasterView.render(col);
    if(this.open){ return this.renderLesson(LESSONS.find(l=>l.id===this.open)); }
    return Path.render(col);
  },
  renderLesson(l){
    const col=$("#lessonsCol"), P=Store.profile; const st=P.lessons[l.id]=P.lessons[l.id]||{puzzles:{}}; st.puzzles=st.puzzles||{};
    const idx=LESSONS.indexOf(l); const ORDER=STAGES.flatMap(x=>x.lessons); const oi=ORDER.indexOf(l.id); const nxt=LESSONS.find(x=>x.id===ORDER[oi+1]); const stg=STAGES.find(x=>x.lessons.includes(l.id));
    const mine=P.drills.filter(d=>d.tag===l.tag);
    const vids=suggestLessons(3, LESSON_KINDS[l.id]||[]).filter(L=>(LESSON_KINDS[l.id]||[]).includes(L.kind)).concat(suggestLessons(3)).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3);
    const theme=LESSON_THEME[l.id];
    col.innerHTML=`<button class="btn small ghost back" id="lBack">← Road to 1000</button>
      <div class="lhead"><span class="label">Stage ${stg.n} · lesson ${stg.lessons.indexOf(l.id)+1} of ${stg.lessons.length} · ${esc(TAGS[l.tag].name)}</span><h2 style="margin-top:4px">${esc(l.title)}</h2></div>
      ${THEORY[l.id]? `<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="row" style="justify-content:space-between"><h3 style="font-size:18px">Watch the lesson</h3><span class="note">${THEORY[l.id].length} parts</span></div><div id="lPlayer"></div></div>`:""}
      <div class="prose">${l.body}</div>
      ${STANDALONE&&VIDEOS.some(v=>v.lesson===l.id)? `<div class="card" style="display:flex;flex-direction:column;gap:10px"><div><h3 style="font-size:18px">Watch a master</h3><p class="note" style="margin-top:2px">Full lessons on this topic from titled players.</p></div><div class="ytgrid">${VIDEOS.filter(v=>v.lesson===l.id).map(ytHTML).join("")}</div></div>`:""}
      ${vids.length? `<div class="card" style="display:flex;flex-direction:column;gap:10px"><div><h3 style="font-size:18px">Keep practising</h3><p class="note" style="margin-top:2px">Video lessons from real games at your level.</p></div><div class="path">${vids.map(libCardHTML).join("")}</div></div>`:""}
      ${l.puzzles.map(id=>`<div class="card puzzle" id="pz-${id}"></div>`).join("")}
      <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3 style="font-size:18px">From your games</h3>
        ${mine.length? `<p class="note">${mine.length} ${mine.length===1?"position":"positions"} where you made this kind of mistake. Solving them is the fastest way to stop repeating it.</p><div class="drill-list">${mine.slice(-4).reverse().map(d=>`<button class="moment" data-drill="${d.id}"><span class="tag ${d.cls}">${CLASS_NAG[d.cls]}</span><span style="min-width:0"><span class="san">${esc(d.move)}</span><br><span class="note">${esc(d.why||"")}</span></span><span class="d">${d.solved?"cleared":"to clear"}</span></button>`).join("")}</div>` : `<p class="note">No ${esc(TAGS[l.tag].name.toLowerCase())} mistakes in your reviewed games yet. Review a few games and they'll show up here.</p>`}
        ${theme? `<a class="btn" href="#puzzles" id="lPractise">Practise ${esc(THEMES[theme].name.toLowerCase())} puzzles →</a>`:""}
      </div>
      <div class="row" style="justify-content:space-between">
        ${st.done? `<span class="tag best">Lesson complete</span>` : `<button class="btn" id="lDone">Mark lesson done</button>`}
        ${nxt? `<button class="btn primary" id="lNext">Next: ${esc(nxt.title)} →</button>`:""}
      </div>`;
    $("#lBack").addEventListener("click",()=>{ this.open=null; this.render(); window.scrollTo(0,0); });
    if(THEORY[l.id]) this.player=new LessonPlayer($("#lPlayer"), THEORY[l.id], {title:l.title, onEnd:()=>{ if(!l.puzzles.length && !st.done){ markLessonDone(st); Store.save(); const b=$("#lDone"); if(b) b.outerHTML=`<span class="tag best">Lesson complete</span>`; } }});
    $("#lNext")?.addEventListener("click",()=>{ this.open=nxt.id; this.render(); window.scrollTo(0,0); });
    $("#lDone")?.addEventListener("click",()=>{ markLessonDone(st); Store.save(); this.render(); });
    $("#lPractise")?.addEventListener("click",()=>{ Tactics.theme=theme; Tactics.cur=null; });
    $$("[data-drill]",col).forEach(b=>b.addEventListener("click",()=>{ Drills.cur=b.dataset.drill; location.hash="drills"; }));
    bindLib(col); bindYT(col);
    const check=()=>{ if(l.puzzles.length && l.puzzles.every(p=>st.puzzles[p]) && !st.done){ markLessonDone(st); Store.save(); setTimeout(()=>{ const b=$("#lDone"); if(b) b.outerHTML=`<span class="tag best">Lesson complete</span>`; },0); } };
    l.puzzles.forEach((id,i)=>{
      const pz=PUZZLES.find(p=>p.id===id), txt=PZ_TEXT[id], el=$("#pz-"+id);
      const solved=()=>{ st.puzzles[id]=true; Store.save(); check(); };
      if(pz.kind==="choice") mountChoice(el,pz,txt,solved);
      else mountPuzzle(el,{fen:pz.fen, line:pz.line, accept:pz.accept, prompt:txt.prompt, hint:txt.hint, solved:txt.solved, label:`Puzzle ${i+1}${st.puzzles[id]?" · solved":""}`, onSolved:solved});
    });
  }
};

/* ---------- DRILLS ---------- */
const Drills = {
  cur:null, filter:"todo",
  render(){
    const col=$("#drillsCol"), P=Store.profile, all=P.drills;
    const todo=all.filter(d=>!d.solved), done=all.filter(d=>d.solved);
    if(!all.length){
      col.innerHTML=`<div><h2 style="font-size:26px;font-weight:800">Drills</h2></div><div class="card empty"><h3>No drills yet</h3><p>Every mistake and blunder you make in a reviewed game lands here as a puzzle: the position before you went wrong. Find the better move to clear it.</p><a class="btn primary" href="#review">Review a game</a></div>`; return;
    }
    const d = this.cur? all.find(x=>x.id===this.cur) : null;
    col.innerHTML=`<div><h2 style="font-size:26px;font-weight:800">Drills</h2><p class="muted" style="margin-top:4px">Positions from your games where you went wrong. Find a better move than the one you played.</p></div>
      ${d? `<div class="card puzzle" id="drillBox"></div><div class="row"><button class="btn primary" id="dNext">${todo.filter(x=>x.id!==d.id).length?"Next drill →":"Back to list"}</button></div>` :
        `<div class="card row" style="justify-content:space-between"><span><b class="mono" style="font-size:22px">${todo.length}</b> <span class="muted">to clear · ${done.length} cleared</span></span><button class="btn primary" id="dStart" ${todo.length?"":"disabled"}>${todo.length?"Start drilling":"All clear"}</button></div>`}
      <div class="seg" role="group" aria-label="Filter drills"><button data-f="todo" aria-pressed="${this.filter==="todo"}">To clear (${todo.length})</button><button data-f="done" aria-pressed="${this.filter==="done"}">Cleared (${done.length})</button></div>
      <div class="drill-list">${(this.filter==="todo"?todo:done).slice().reverse().map(x=>`<button class="moment" data-id="${x.id}"><span class="tag ${x.cls}">${CLASS_NAG[x.cls]}</span><span style="min-width:0"><span class="san">${esc(x.move)}</span><br><span class="note">${esc(TAGS[x.tag]?.name||"")}${x.example?" · example game":""}</span></span><span class="d">${esc(x.game)}</span></button>`).join("")||`<p class="note">Nothing here yet.</p>`}</div>
      ${done.length? `<button class="btn small ghost" id="dReset" style="align-self:flex-start">Put cleared drills back in the queue</button>`:""}`;
    $("#dStart")?.addEventListener("click",()=>{ this.cur=todo[0].id; this.render(); });
    $$("[data-f]",col).forEach(b=>b.addEventListener("click",()=>{ this.filter=b.dataset.f; this.render(); }));
    $$(".drill-list .moment",col).forEach(b=>b.addEventListener("click",()=>{ this.cur=b.dataset.id; this.render(); window.scrollTo(0,0); }));
    $("#dReset")?.addEventListener("click",()=>{ P.drills.forEach(x=>x.solved=false); Store.save(); App.refresh(); });
    if(d){
      const vids=suggestLessons(1, tagKinds(d.tag));
      mountPuzzle($("#drillBox"),{fen:d.fen, line:[d.best], prompt:`From ${d.game}: you played ${d.played} here (${CLASS_LABEL[d.cls].toLowerCase()}). Find something better.`, hint:TAGS[d.tag]? `This one was tagged “${TAGS[d.tag].name}”. ${TIPS[d.tag][0]}`:"Look at checks, captures and threats.",
        solved:`The engine's top move was ${d.bestSan}. ${d.why? "What went wrong in the game: "+d.why : ""}`, label:d.move, engineCheck:{wcBefore:d.wcBefore},
        after: vids.length? `<div style="width:100%"><div class="label" style="margin-bottom:6px">Watch to fix this for good</div><div class="path">${libCardHTML(vids[0])}</div></div>`:"",
        onButtons:(b)=>bindLib(b),
        onFirstWrong:()=>{ d.tries++; }, onSolved:()=>{ if(!d.solved) logEvent("d"); d.solved=true; Store.save(); App.badge(); }});
      $("#dNext").addEventListener("click",()=>{ const nx=P.drills.find(x=>!x.solved&&x.id!==d.id); this.cur=nx?nx.id:null; this.render(); window.scrollTo(0,0); });
    }
  }
};

App.init();
</script>

</body>
</html>
