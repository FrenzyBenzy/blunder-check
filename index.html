<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blunder Check">
<meta name="theme-color" content="#0E6B66">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Blunder Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone-first single column; scoresheet + board as the core objects; bottom tab bar. Wider screens put board and panel side by side. */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --sunk:#E3E8E6; --ink:#16201D; --muted:#5A6863; --line:#D3DBD8;
  --accent:#0E6B66; --accent-ink:#FFFFFF; --accent-soft:#D5ECE9;
  --sq-light:#E4E7DF; --sq-dark:#8A9E96; --sq-last:rgba(232,190,64,.55); --sq-sel:rgba(14,107,102,.55);
  --c-best:#2C8A55; --c-good:#7C8C86; --c-inacc:#C99A10; --c-mistake:#DB6E1F; --c-blunder:#C3322A;
  --wbar:#F7F8F6; --bbar:#26302C;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1413; --surface:#171E1C; --sunk:#111816; --ink:#E6ECEA; --muted:#97A6A1; --line:#26302D;
  --accent:#4DB8AF; --accent-ink:#06201E; --accent-soft:#183634;
  --sq-light:#B9C3BD; --sq-dark:#6B8079; --sq-last:rgba(232,190,64,.5); --sq-sel:rgba(77,184,175,.6);
  --c-best:#4CB679; --c-good:#8A9994; --c-inacc:#E2B530; --c-mistake:#EE8A3E; --c-blunder:#EE5A50;
  --wbar:#E9ECEA; --bbar:#2B3532; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1413; --surface:#171E1C; --sunk:#111816; --ink:#E6ECEA; --muted:#97A6A1; --line:#26302D;
  --accent:#4DB8AF; --accent-ink:#06201E; --accent-soft:#183634;
  --sq-light:#B9C3BD; --sq-dark:#6B8079; --sq-last:rgba(232,190,64,.5); --sq-sel:rgba(77,184,175,.6);
  --c-best:#4CB679; --c-good:#8A9994; --c-inacc:#E2B530; --c-mistake:#EE8A3E; --c-blunder:#EE5A50;
  --wbar:#E9ECEA; --bbar:#2B3532; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand .nag{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--c-blunder);border:1.5px solid currentColor;border-radius:6px;padding:0 4px;line-height:18px}
.pill{margin-left:auto;font-size:12px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c-inacc)}
.pill.ok i{background:var(--c-best)} .pill.bad i{background:var(--c-blunder)}

main{max-width:1080px;margin:0 auto;padding-block:18px calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:18px}
.view[hidden]{display:none!important}
.col{max-width:620px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--c-blunder);color:#fff;font-size:10px;line-height:16px;font-family:var(--f-mono)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:6px 11px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,.mv:focus-visible,.opt:focus-visible,.sq:focus-visible,input:focus-visible,textarea:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1 1 160px;min-width:0}
input[type=text],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:110px;resize:vertical;font-family:var(--f-mono);font-size:12.5px;line-height:1.5}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.note{font-size:13.5px;color:var(--muted)}
.err{color:var(--c-blunder);font-size:14px}
.prose{display:flex;flex-direction:column;gap:10px;max-width:65ch}
.prose h4{font-family:var(--f-display);font-size:16px;margin:6px 0 0}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.prose code{font-family:var(--f-mono);font-size:.9em;background:var(--sunk);padding:1px 5px;border-radius:5px}
.prose strong{font-weight:700}

/* hero on coach */
.hello h1{font-size:clamp(26px,7vw,36px);font-weight:800;letter-spacing:-.02em}
.hello p{margin-top:6px;color:var(--muted);max-width:52ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat svg{display:block;width:100%;height:26px;margin-top:6px}
.weak{display:flex;flex-direction:column;gap:10px}
.weak-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.weak-row .bar{grid-column:1 / -1;height:7px;border-radius:4px;background:var(--sunk);overflow:hidden}
.weak-row .bar i{display:block;height:100%;background:var(--c-mistake);border-radius:4px}
.weak-row .n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tip{border-left:4px solid var(--accent);background:var(--surface);border-radius:4px var(--r) var(--r) 4px;padding:14px 16px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tip p{margin-top:6px;font-size:16px;line-height:1.5}
.next{display:flex;gap:14px;align-items:center}
.next .num{flex:none;width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto}
.msg{padding:10px 13px;border-radius:12px;max-width:92%;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.ai{align-self:flex-start;background:var(--sunk)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}

/* board */
.board{position:relative;width:100%;aspect-ratio:1/1;max-width:100%;border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:0 0 0 1px var(--line)}
.board .grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{position:relative;cursor:default}
.sq.light{background:var(--sq-light)} .sq.dark{background:var(--sq-dark)}
.sq.last::before{content:"";position:absolute;inset:0;background:var(--sq-last)}
.sq.sel::before{content:"";position:absolute;inset:0;background:var(--sq-sel)}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(220,40,30,.85) 0%,rgba(220,40,30,.35) 45%,transparent 72%)}
.sq .pc{position:absolute;inset:4%;background-size:contain;background-repeat:no-repeat;background-position:center;z-index:1;pointer-events:none}
.sq.tgt::after{content:"";position:absolute;inset:0;margin:auto;width:30%;height:30%;border-radius:50%;background:rgba(10,30,25,.3);z-index:2;pointer-events:none}
.sq.tgt.cap::after{width:100%;height:100%;border-radius:0;background:radial-gradient(circle at 50% 50%,transparent 0 57%,rgba(10,30,25,.3) 58% 70%,transparent 71%)}
.sq.hov::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 4px rgba(255,255,255,.75);background:rgba(255,255,255,.12)}
.board.live{touch-action:none}
.board.live .sq{cursor:pointer}
.sq .pc{will-change:transform}
.board .ghost{position:absolute;left:0;top:0;z-index:6;background-size:contain;background-repeat:no-repeat;background-position:center;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.sq.hint::before{content:"";position:absolute;inset:0;background:rgba(77,184,175,.55);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.sq .cf,.sq .cr{position:absolute;font:600 10px/1 var(--f-mono);z-index:2;pointer-events:none}
.sq .cf{right:3px;bottom:2px} .sq .cr{left:3px;top:3px}
.sq.light .cf,.sq.light .cr{color:var(--sq-dark)} .sq.dark .cf,.sq.dark .cr{color:var(--sq-light)}
.board svg.arrows{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.board .flash{position:absolute;inset:0;z-index:4;pointer-events:none;display:grid;place-items:center;font:800 42px var(--f-display);color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
.board .flash.on{opacity:1}

/* review */
.rev{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:900px){.rev{grid-template-columns:minmax(0,480px) minmax(0,1fr);align-items:start}.rev .boardcol{position:sticky;top:76px}}
.boardcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.players{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600}
.players span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.players .clk{font-family:var(--f-mono);font-weight:400;color:var(--muted);margin-left:6px}
.evalbar{position:relative;height:22px;border-radius:6px;background:var(--bbar);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.evalbar i{position:absolute;left:0;top:0;bottom:0;background:var(--wbar);transition:width .25s}
.evalbar b{position:absolute;top:0;bottom:0;display:flex;align-items:center;font:600 11.5px var(--f-mono);padding:0 7px;color:#111}
.evalbar b.r{right:0;color:#eee}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mvinfo{display:flex;flex-direction:column;gap:8px}
.mvhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mvhead .san{font:700 22px var(--f-mono)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;color:#fff;background:var(--c-good)}
.tag.best{background:var(--c-best)} .tag.inacc{background:var(--c-inacc);color:#1d1600} .tag.mistake{background:var(--c-mistake)} .tag.blunder{background:var(--c-blunder)}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acc b{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.acc.you b{color:var(--accent)}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.counts .tag{font-family:var(--f-mono)}
.graph{width:100%;height:84px;display:block;cursor:pointer;border-radius:8px}
.sheet{overflow-x:auto}
.sheet table{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.sheet td{border-bottom:1px solid var(--line);padding:0}
.sheet td.no{width:38px;color:var(--muted);padding:6px 4px;text-align:right}
.mv{width:100%;text-align:left;background:none;border:0;padding:7px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;border-radius:6px;font-family:inherit}
.mv:hover{background:var(--sunk)}
.mv.cur{background:var(--accent-soft);color:var(--ink)}
.mv .dot{width:8px;height:8px;border-radius:50%;flex:none}
.mv .t{margin-left:auto;font-size:11px;color:var(--muted)}
.mv.mine{font-weight:600}
.dot.inacc{background:var(--c-inacc)} .dot.mistake{background:var(--c-mistake)} .dot.blunder{background:var(--c-blunder)}
.moments{display:flex;flex-direction:column;gap:6px}
.moment{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;width:100%}
.moment .san{font:600 14px var(--f-mono)}
.moment .d{font-size:12.5px;color:var(--muted);margin-left:auto;text-align:right}
.progress{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.ai-out{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:14.5px}

/* lessons */
.path{display:flex;flex-direction:column;gap:10px}
.lesson-card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.lesson-card .num{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 15px var(--f-mono);color:var(--muted)}
.lesson-card.done .num{background:var(--c-best);border-color:var(--c-best);color:#fff}
.lesson-card.rec{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lesson-card h3{font-size:16.5px}
.lesson-card p{font-size:13px;color:var(--muted);margin-top:2px}
.lesson-card .meta{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;flex:none}
.recflag{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.back{align-self:flex-start}
.lhead h2{font-size:clamp(24px,6.5vw,32px);font-weight:800;letter-spacing:-.015em}
.checklist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;counter-reset:c}
.checklist li{display:flex;gap:10px;align-items:flex-start;counter-increment:c}
.checklist li::before{content:counter(c);flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 12px var(--f-mono);margin-top:1px}
.puzzle{display:flex;flex-direction:column;gap:12px}
.puzzle .board{max-width:440px;margin:0 auto}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fb{font-size:14.5px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.fb.good{background:color-mix(in srgb,var(--c-best) 16%,var(--surface));}
.fb.bad{background:color-mix(in srgb,var(--c-blunder) 13%,var(--surface));}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-family:var(--f-mono);font-weight:600}
.opt.right{border-color:var(--c-best);box-shadow:0 0 0 1px var(--c-best)}
.opt.wrong{border-color:var(--c-blunder);opacity:.8}
.turn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.turn i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}
.turn i.w{background:#fff} .turn i.b{background:#1b1b1b}
.empty{text-align:center;padding:26px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-size:20px}
.empty p{max-width:42ch;color:var(--muted)}
.drill-list{display:flex;flex-direction:column;gap:8px}
/* lesson player */
.lp{display:flex;flex-direction:column;gap:10px}
.lp-stage{position:relative;max-width:460px;width:100%;margin:0 auto}
.lp-big{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--bg) 45%,transparent);border-radius:6px;font-family:var(--f-display);font-weight:800;font-size:18px;text-align:center;padding:16px}
.lp-bigbtn{width:72px;height:72px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.lp-bigbtn svg{width:30px;height:30px;margin-left:4px}
.lp-cap{min-height:4.8em;font-size:16px;line-height:1.5;background:var(--sunk);border-radius:10px;padding:12px 14px;max-width:65ch}
.lp-track{display:flex;gap:4px}
.lp-seg{flex:1;height:14px;border:0;background:none;padding:4px 0;cursor:pointer}
.lp-seg i{display:block;height:6px;border-radius:3px;background:var(--line)}
.lp-seg.done i{background:var(--accent);opacity:.55}
.lp-seg.cur i{background:var(--accent)}
.lp-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lp-sp{margin-left:auto;display:flex;gap:6px}
.sq.mark::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 4px var(--c-inacc);background:color-mix(in srgb,var(--c-inacc) 22%,transparent)}
.bands{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.band{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font:600 13px var(--f-mono);cursor:pointer}
.band.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.band.lock{color:var(--muted);background:transparent}
.ytgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ytw{display:flex;flex-direction:column;gap:6px;min-width:0}
.yt{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:10px;overflow:hidden;background:#000;cursor:pointer}
.yt img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;cursor:pointer}
.yt-play svg{width:26px;height:26px;margin-left:4px}
.yt-meta b{display:block;font-size:14.5px;line-height:1.3}
.yt-meta .by{font-size:12.5px;color:var(--muted)}
/* roadmap */
.road{display:flex;flex-direction:column;gap:10px}
.rnow{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1.05;font-variant-numeric:tabular-nums}
.rnow span{font-size:18px;font-weight:600}
.rtrack{position:relative;height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.rtrack i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--c-best));border-radius:6px}
.rtrack em{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.rlabels{position:relative;height:16px;font-size:11px;color:var(--muted)}
.rlabels span{position:absolute;top:0}
.rlabels span:first-child{left:0} .rlabels span:last-child{right:0}
.rlabels span:nth-child(2),.rlabels span:nth-child(3){transform:translateX(-50%)}
.rchart{width:100%;height:60px;display:block}
.stage{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.stage.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stage.later{background:transparent}
.stage-h{display:flex;gap:12px;align-items:center}
.stage-h h3{font-size:20px}
.snum{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 18px var(--f-display);background:var(--sunk);color:var(--muted)}
.stage.cur .snum{background:var(--accent);color:var(--accent-ink)} .stage.done .snum{background:var(--c-best);color:#fff}
.ms{display:flex;flex-direction:column;gap:6px}
.m,.planitem{display:flex;gap:10px;align-items:center;font-size:14px}
.box{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.m.ok .box,.planitem.done .box{background:var(--c-best);border-color:var(--c-best)}
.m .mt,.planitem .pt{flex:1;min-width:0}
.m.ok .mt{color:var(--muted)}
.planlist{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.planitem{text-decoration:none;color:inherit;background:none;border:0;text-align:left;width:100%;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.planitem:last-child{border-bottom:0}
.planitem.done .pt{text-decoration:line-through;color:var(--muted)}
.pp{font-size:12.5px;color:var(--muted)}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.goal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;font-size:13.5px}
.goal .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--accent)}
.lesson-card .num svg{width:14px;height:14px;margin-left:2px}
.next .num svg{width:20px;height:20px;margin-left:3px}
/* videos */
.vids{display:flex;flex-direction:column;gap:8px}
.vid{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.vid:hover{border-color:var(--accent)}
.vid .play{flex:none;width:44px;height:44px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.vid .play svg{width:18px;height:18px;margin-left:2px}
.vid.seen .play{background:var(--sunk);color:var(--muted)}
.vid b{display:block;font-size:14.5px;line-height:1.3}
.vid span.by{font-size:12.5px;color:var(--muted)}
.vid .ext{margin-left:auto;flex:none;color:var(--muted);font-size:12px}
.seenbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:12px;padding:5px 8px;cursor:pointer;color:var(--muted)}
.vidrow{display:flex;gap:6px;align-items:stretch}
.vidrow .vid{flex:1;min-width:0}
/* tactics */
.trow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rating b{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.rating .delta{font:600 14px var(--f-mono);margin-left:6px}
.delta.up{color:var(--c-best)} .delta.down{color:var(--c-blunder)}
.chips .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mini{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.mini b{color:var(--ink);font-family:var(--f-mono)}
.explain{display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.explain p{max-width:65ch}
.foot{font-size:12px;color:var(--muted);text-align:center;max-width:60ch;margin:6px auto 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

const LESSONS = [
  {id:"blunder-check", tag:"hanging", title:"The blunder check", sub:"Stop giving away pieces", min:6,
   body:`<p>At your level, games are rarely lost to brilliant play. They're lost when a piece gets left where it can be taken for free. Fix that habit and you'll gain more rating than from anything else in this app.</p>
<p>Before every move, run three quick questions. Say them in your head until they're automatic.</p>
<ol class="checklist"><li><span><b>What did their last move do?</b> What does that piece attack now? Is there a threat?</span></li><li><span><b>Is my move safe?</b> After I play it, can any of my pieces be taken for free?</span></li><li><span><b>Can I win something?</b> Look at every check, capture and threat I have.</span></li></ol>
<p>Your opponents are also around 400, so they will hang pieces too. Question three is how you collect them.</p>`,
   puzzles:["free1","free2"]},
  {id:"counting", tag:"hanging", title:"Count before you capture", sub:"Attackers, defenders and piece values", min:6,
   body:`<p>Piece values give you a quick way to judge trades: pawn 1, knight 3, bishop 3, rook 5, queen 9. The king can't be traded.</p>
<p>Before you capture on a square, count how many of your pieces attack it and how many of theirs defend it. If you have more attackers, the capture usually works. If they have as many defenders, start with your cheapest piece, or don't capture at all.</p>
<p>A common trap: taking a pawn with a knight when the pawn is defended. You win 1 point and lose 3.</p>
<p>And whenever your opponent takes one of your pieces, look for the recapture before anything else.</p>`,
   puzzles:["count1","count2"]},
  {id:"forks", tag:"tactics", title:"Forks", sub:"One move, two targets", min:7,
   body:`<p>A fork is one piece attacking two things at once. Your opponent can only save one of them.</p>
<p>Knights are the best forking pieces because their jump is hard to see. Pawns fork too, and queens fork all the time.</p>
<p>The strongest forks include a check, because your opponent has to deal with the check and then loses the other piece. When the enemy king and queen are a knight's jump from the same square, stop and look.</p>`,
   puzzles:["fork1","fork2"]},
  {id:"pins", tag:"tactics", title:"Pins and skewers", sub:"Attacking pieces in a line", min:7,
   body:`<p>Bishops, rooks and queens attack along lines. When two enemy pieces sit on the same line, you can use it.</p>
<p><b>Pin:</b> you attack a piece that can't move because something more valuable is behind it. If the king is behind, the pinned piece can't move at all. Then attack it again, ideally with a pawn.</p>
<p><b>Skewer:</b> the valuable piece is in front. You attack it, it moves away, and you take the piece behind.</p>
<p>When your own king and queen are on the same line, be careful: you're the one who can get skewered.</p>`,
   puzzles:["pin1","skewer1"]},
  {id:"mates", tag:"mates", title:"Checkmate patterns", sub:"The mates you'll actually see", min:7,
   body:`<p>Most games at 400 end with one of a few patterns. Learn to spot them for both sides.</p>
<ul><li><b>Back-rank mate:</b> a rook or queen checks along the back rank and the king is trapped by its own pawns.</li><li><b>Scholar's mate:</b> a queen and bishop both aim at f7 (or f2). The queen takes, protected by the bishop.</li><li><b>Supported queen mate:</b> the queen lands right next to the king, protected by another piece.</li></ul>
<p>Every time your opponent's king has few escape squares, look at all your checks. One of them might end the game.</p>`,
   puzzles:["mate1","mate2"]},
  {id:"opening", tag:"opening", title:"Opening principles", sub:"A simple plan for the first 10 moves", min:6,
   body:`<p>You don't need to memorise openings yet. Follow these rules and you'll reach a good middlegame almost every time:</p>
<ol class="checklist"><li><span>Put a pawn in the centre (e4 or d4).</span></li><li><span>Develop knights, then bishops, toward the centre.</span></li><li><span>Castle early, ideally by move 8 to 10.</span></li><li><span>Don't bring the queen out early, and don't move the same piece twice without a reason.</span></li><li><span>Connect your rooks, then make a plan.</span></li></ol>`,
   puzzles:["open1","open2"]},
  {id:"king", tag:"kingSafety", title:"Keep your king safe", sub:"Castle, and defend before you attack", min:6,
   body:`<p>A king in the middle of the board gets attacked once the centre opens up. Castling puts it behind a wall of pawns and brings a rook into play.</p>
<p>After castling, leave the three pawns in front of your king alone unless you have a clear reason. Each pawn push opens a path for enemy pieces.</p>
<p>When your opponent makes a direct threat against your king, deal with it first. Your own attack can wait one move. Losing to mate can't be undone.</p>`,
   puzzles:["king1","king2"]},

function md(t){

  const out=[]; let list=null;
  const close=()=>{ if(list){ out.push(`</${list}>`); list=null; } };
  for (const raw of esc(t).split(/\n/)){
    const l = raw.trim(); let m;
    if(!l){ close(); continue; }
    if((m=l.match(/^#{1,4}\s+(.*)/))){ close(); out.push(`<h4>${inline(m[1])}</h4>`); continue; }
    if((m=l.match(/^[-*•]\s+(.*)/))){ if(list!=="ul"){ close(); out.push("<ul>"); list="ul"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if((m=l.match(/^\d+[.)]\s+(.*)/))){ if(list!=="ol"){ close(); out.push("<ol>"); list="ol"; } out.push(`<li>${inline(m[1])}</li>`); continue; }

}

}

function pieceList(fen){

  const order="KQRBNP";

async function evaluate(fen, opts){
  const c=new Chess(fen), stm=turnOf(fen);
  if(c.in_checkmate()) return {wc: stm==="w"?-1:1, term:"mate", best:null, pv:[]};
  if(c.in_stalemate()||c.insufficient_material()||c.in_threefold_repetition()) return {wc:0, term:"draw", best:null, pv:[]};
  const r = await Engine.analyse(fen, opts);
  const sign = stm==="w"?1:-1;
  if(r.type==="mate"){ const m=r.val*sign; return {mate:m, wc: m>0?1:-1, best:r.best, pv:r.pv||[]}; }
  const cp=(r.val||0)*sign; return {cp, wc:wcFromCp(cp), best:r.best, pv:r.pv||[]};
}

  }

    const d=this.drag; if(!d || e.pointerId!==d.id) return; this.drag=null;
    if(d.moved){
      d.ghost.remove(); if(d.over&&this.sqEls[d.over]) this.sqEls[d.over].classList.remove("hov");
      const to=this.sqAt(e.clientX,e.clientY);
      if(to && this.targets.includes(to)) this.commit(d.from, to, false); else this.render();
    } else if(d.wasSel){ this.sel=null; this.targets=[]; this.render(); }
  }
  cancelDrag(){ const d=this.drag; if(!d) return; this.drag=null; d.ghost?.remove(); this.render(); }
  commit(from, to, animate){ this.sel=null; this.targets=[]; this.skipAnim=!animate; this.render(); this.opts.onMove && this.opts.onMove(from, to); }
}

/* ================= PGN ================= */
function parsePGN(text){
  const headers={}; let m; const hre=/\[(\w+)\s+"([^"]*)"\]/g;
  while((m=hre.exec(text))) headers[m[1]]=m[2];
  const body=text.replace(/\[(\w+)\s+"[^"]*"\]/g," ");
  const toks=body.match(/\{[^}]*\}|;[^\n]*|\([^()]*\)|\$\d+|\d+\.+|[^\s{}();]+/g)||[];
  const sans=[], clocks=[];
  for(const t of toks){
    if(t[0]==="{"){ const c=t.match(/%clk\s+(\d+):(\d+):(\d+(?:\.\d+)?)/); if(c&&sans.length) clocks[sans.length-1]=(+c[1])*3600+(+c[2])*60+(+c[3]); continue; }
    if(t[0]===";"||t[0]==="("||t[0]==="$"||/^\d+\.+$/.test(t)||/^(1-0|0-1|1\/2-1\/2|\*)$/.test(t)) continue;
    const s=t.replace(/^\d+\.+/,"").replace(/[!?]+$/,""); if(s) sans.push(s);
  }
  const startFen = headers.FEN || START;
  const c = new Chess(startFen); if(headers.FEN && !c.load(headers.FEN)) throw new Error("The starting position (FEN) in this PGN isn't valid.");
  const plies=[];
  for(let i=0;i<sans.length;i++){
    const before=c.fen(); const mv=c.move(sans[i], {sloppy:true});
    if(!mv){ if(i===0) throw new Error(`Couldn't read the move “${sans[i]}”. Check you copied the whole PGN.`); break; }
    plies.push({san:mv.san, uci:mv.from+mv.to+(mv.promotion||""), from:mv.from, to:mv.to, mover:mv.color, fenBefore:before, fenAfter:c.fen(), clock: clocks[i]??null, cap:mv.captured||null});
  }
  if(!plies.length) throw new Error("No moves found. Paste the full PGN, including the moves.");
  // time spent
  const tc=(headers.TimeControl||"").match(/^(\d+)(?:\+(\d+))?/); const base=tc?+tc[1]:null, inc=tc&&tc[2]?+tc[2]:0;
  const lastClk={w:base,b:base};
  plies.forEach(p=>{ if(p.clock!=null && lastClk[p.mover]!=null){ p.spent=Math.max(0,lastClk[p.mover]-p.clock+inc); } lastClk[p.mover]=p.clock??lastClk[p.mover]; });
  return {headers, startFen, plies, base};
}

/* ================= ANALYSIS ================= */
function classify(drop, played, best){
  if(played===best) return "best";
  if(drop>=0.3) return "blunder"; if(drop>=0.2) return "mistake"; if(drop>=0.1) return "inacc"; return "good";
}
const CLASS_LABEL={best:"Best move",good:"Good",inacc:"Inaccuracy",mistake:"Mistake",blunder:"Blunder"};
const CLASS_NAG={best:"",good:"",inacc:"?!",mistake:"?",blunder:"??"};
function moveAccuracy(before, after){ const wb=50+50*before, wa=50+50*after; return Math.max(0,Math.min(100, 103.1668*Math.exp(-0.04354*Math.max(0,wb-wa))-3.1669)); }
function nonPawnMaterial(fen){ const v={Q:9,R:5,B:3,N:3}; return Object.values(fenPieces(fen)).reduce((s,p)=>s+(v[p[1]]||0),0); }

function tagMistake(rv, i){
  const p=rv.plies[i], eb=rv.evals[i], ea=rv.evals[i+1], side=p.mover, tags=[];
  if(eb.mate!=null && (side==="w"?eb.mate>0:eb.mate<0) && !(ea.term==="mate"||(ea.mate!=null&&(side==="w"?ea.mate>0:ea.mate<0)))) tags.push("mates");
  else if(ea.mate!=null && (side==="w"?ea.mate<0:ea.mate>0)) tags.push("kingSafety");
  else {
    let bestTac=false, hung=false;
    try{ const c=new Chess(p.fenBefore); const bm=c.move({from:eb.best.slice(0,2),to:eb.best.slice(2,4),promotion:eb.best[4]||"q"}); bestTac=!!bm && (!!bm.captured || /[+#]/.test(bm.san)); }catch(e){}
    try{ if(ea.best){ const c=new Chess(p.fenAfter); const rm=c.move({from:ea.best.slice(0,2),to:ea.best.slice(2,4),promotion:ea.best[4]||"q"}); hung=!!rm && !!rm.captured && rm.captured!=="p"; } }catch(e){}
    if(hung) tags.push("hanging"); else if(bestTac) tags.push("tactics");
    else if(i<20) tags.push("opening"); else if(nonPawnMaterial(p.fenBefore)<=14) tags.push("endgame"); else tags.push("tactics");
  }
  if(p.clock!=null && p.clock<60) tags.push("time");
  return tags;
}

async function runAnalysis(rv, onProgress, signal){
  Engine.newGame();
  const n=rv.plies.length; rv.evals=rv.evals||[];
  const fens=[rv.plies[0].fenBefore, ...rv.plies.map(p=>p.fenAfter)];
  for(let i=0;i<fens.length;i++){
    if(signal.aborted) return false;
    if(!rv.evals[i]) rv.evals[i]=await evaluate(fens[i], {depth:12, movetime:650});
    onProgress(i+1, fens.length);
  }
  finishAnalysis(rv); return true;
}
function finishAnalysis(rv){
  const acc={w:[],b:[]}; rv.classes=[]; rv.tags=[];
  rv.plies.forEach((p,i)=>{
    const before=sideWc(rv.evals[i],p.mover), after=sideWc(rv.evals[i+1],p.mover);
    const drop=Math.max(0,before-after);
    rv.classes[i]=classify(drop, p.uci, rv.evals[i].best); p.drop=drop;
    acc[p.mover].push(moveAccuracy(before,after));
    rv.tags[i] = (p.mover===rv.side && (rv.classes[i]==="mistake"||rv.classes[i]==="blunder")) ? tagMistake(rv,i) : [];
  });
  const avg=a=>a.length? Math.round(a.reduce((s,x)=>s+x,0)/a.length) : 0;
  rv.accuracy={w:avg(acc.w), b:avg(acc.b)};
  const cnt=s=>{ const o={inacc:0,mistake:0,blunder:0}; rv.plies.forEach((p,i)=>{ if(p.mover===s && o[rv.classes[i]]!=null) o[rv.classes[i]]++; }); return o; };
  rv.counts={w:cnt("w"), b:cnt("b")};
  rv.done=true; rv.savedAt=Date.now();
}
function recordGame(rv){
  const P=Store.profile;
  if(P.games.some(g=>g.id===rv.id)) return;
  if(!rv.example) logEvent("g");
  const me=rv.side, opp=me==="w"?"b":"w", tagCount={};
  rv.tags.forEach(ts=>ts.forEach(t=>{ tagCount[t]=(tagCount[t]||0)+1; P.tags[t]=(P.tags[t]||0)+1; }));
  P.games.push({id:rv.id, date:rv.headers.Date||"", white:rv.headers.White||"White", black:rv.headers.Black||"Black", side:me, result:rv.headers.Result||"*", acc:rv.accuracy[me], oppAcc:rv.accuracy[opp], counts:rv.counts[me], tags:tagCount, plies:rv.plies.length, example:!!rv.example, at:Date.now()});
  if(P.games.length>50) P.games=P.games.slice(-50);
  const label=`${rv.headers.White||"White"} vs ${rv.headers.Black||"Black"}`;
  rv.plies.forEach((p,i)=>{
    if(p.mover!==me || !(rv.classes[i]==="mistake"||rv.classes[i]==="blunder") || !rv.evals[i].best) return;
    P.drills.push({id:rv.id+"-"+i, fen:p.fenBefore, played:p.san, playedUci:p.uci, best:rv.evals[i].best, bestSan:uciToSan(p.fenBefore, rv.evals[i].best), wcBefore:sideWc(rv.evals[i],me), side:me, tag:rv.tags[i][0]||"tactics", cls:rv.classes[i], why:explainPly(rv,i).first, game:label, move:moveNoLabel(p.fenBefore)+" "+p.san, solved:false, tries:0, example:!!rv.example});
  });
  if(P.drills.length>60){ const keep=P.drills.filter(d=>!d.solved); P.drills = keep.length>60? keep.slice(-60) : P.drills.filter(d=>!d.solved).concat(P.drills.filter(d=>d.solved).slice(-(60-keep.length))); }
  Store.save(true);
}
function gameId(text){ let h=0; for(let i=0;i<text.length;i++){ h=(h*31+text.charCodeAt(i))|0; } return "g"+(h>>>0).toString(36); }

/* ================= EXPLANATIONS (built in, from engine data) ================= */
const PVAL={p:1,n:3,b:3,r:5,q:9,k:0};
const PNAME={p:"pawn",n:"knight",b:"bishop",r:"rook",q:"queen",k:"king"};
function material(fen, side){ let s=0; for(const p of Object.values(fenPieces(fen))){ const v=PVAL[p[1].toLowerCase()]; s+= p[0]===side? v : -v; } return s; }
function playLine(fen, pv, n){ const c=new Chess(fen); const moves=[]; for(const u of (pv||[]).slice(0,n)){ const m=c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||"q"}); if(!m) break; moves.push(m); } return {fen:c.fen(), moves}; }
/* material change for `side` along the engine line, judged at the end of a capture sequence */
function lineGain(fen, pv, side, n=6){
  const start=material(fen, side); const {moves}=playLine(fen, pv, n); if(!moves.length) return 0;
  const c=new Chess(fen); let best=null;
  moves.forEach((m,i)=>{ c.move(m.san); const next=moves[i+1]; if(!next || !next.captured) { const v=material(c.fen(), side)-start; if(best===null) best=v; else best=v; } });
  return best??0;
}
function canCapture(fen, sq){ try{ return new Chess(fen).moves({verbose:true}).some(m=>m.to===sq); }catch(e){ return false; } }
function moveObj(fen, uci){ try{ const c=new Chess(fen); const m=c.move({from:uci.slice(0,2),to:uci.slice(2,4),promotion:uci[4]||"q"}); return m? {m, after:c.fen()} : null; }catch(e){ return null; } }

/* returns {lines:[...sentences], first:"short reason"} */
function explainMove({fenBefore, uci, eb, ea, cls, mine, spent, clock, tag}){
  const side=turnOf(fenBefore), sideName=side==="w"?"White":"Black", oppName=side==="w"?"Black":"White";
  const You = mine? "You":sideName, you = mine? "you":sideName, your = mine? "your":sideName+"'s";
  const pm=moveObj(fenBefore, uci); if(!pm) return {lines:[], first:""};
  const {m, after}=pm; const out=[];
  const best = eb?.best? moveObj(fenBefore, eb.best) : null;
  const bestSan = best? best.m.san : null;
  if(cls==="best"){
    if(eb?.mate!=null && (side==="w"?eb.mate>0:eb.mate<0)) out.push(Math.abs(eb.mate)===1? `${m.san} is checkmate.` : `${m.san} is the fastest way to force checkmate (mate in ${Math.abs(eb.mate)}).`);
    else if(m.captured && !canCapture(after, m.to)) out.push(`${m.san} wins the ${PNAME[m.captured]} on ${m.to} for free. Exactly right.`);
    else if(m.captured) out.push(`${m.san} was the engine's top choice. The capture on ${m.to} keeps the material balance in ${your} favour.`);
    else if(/\+/.test(m.san)) out.push(`${m.san} was the engine's top choice. The check forces ${oppName}'s reply.`);
    else out.push(`${m.san} was the engine's top choice here.`);
    return {lines:out, first:out[0]};
  }
  if(cls==="good"){
    out.push(bestSan? `${m.san} is fine. The engine slightly preferred ${bestSan}, but the difference is small.` : `${m.san} is a solid move.`);
    return {lines:out, first:out[0]};
  }
  const hadMate = eb?.mate!=null && (side==="w"?eb.mate>0:eb.mate<0);
  const stillMate = ea?.term==="mate" || (ea?.mate!=null && (side==="w"?ea.mate>0:ea.mate<0));
  const allowsMate = ea?.mate!=null && (side==="w"?ea.mate<0:ea.mate>0);
  if(hadMate && !stillMate){
    const n=Math.abs(eb.mate);
    out.push(n===1? `${You} had checkmate in one with ${bestSan}.` : `${You} had a forced checkmate in ${n}, starting with ${bestSan}: ${pvToSan(fenBefore, eb.pv, n*2-1)}.`);
  } else if(allowsMate){
    const n=Math.abs(ea.mate);
    out.push(n===1? `This allows checkmate in one: ${pvToSan(after, ea.pv, 1)}.` : `This allows a forced checkmate in ${n}: ${pvToSan(after, ea.pv, n*2-1)}.`);
    if(bestSan) out.push(`${bestSan} would have kept ${your} king safe.`);
  } else {
    let said=false;
    const reply = ea?.best? moveObj(after, ea.best) : null;
    if(reply){
      const r=reply.m, lost=-lineGain(after, ea.pv, side, 6);
      if(r.captured && r.captured!=="p" && lost>=2){
        const what = r.to===m.to ? `the ${PNAME[m.piece]} ${you} just moved` : `${your} ${PNAME[r.captured]} on ${r.to}`;
        const prot = canCapture(reply.after, r.to) ? "can be won" : "is left unprotected";
        out.push(`This move means ${what} ${prot}: ${oppName} plays ${r.san}${lost>PVAL[r.captured]?` and comes out about ${lost} points ahead`:""}.`);
        said=true;
      } else if(/\+/.test(r.san) && lost>=2){
        out.push(`It allows ${r.san}, a check that wins material: ${pvToSan(after, ea.pv, 4)}.`); said=true;
      } else if(m.captured && lost>=2 && canCapture(after, m.to) && PVAL[m.piece]>PVAL[m.captured]){
        out.push(`The capture on ${m.to} loses material: the square is defended, so ${your} ${PNAME[m.piece]} gets taken back.`); said=true;
      }
    }
    if(best){
      const gain=lineGain(fenBefore, eb.pv, side, 6);
      if(best.m.captured && best.m.captured!=="p" && !canCapture(best.after, best.m.to)) out.push(`${You} missed ${bestSan}, which wins the ${PNAME[best.m.captured]} on ${best.m.to} for free.`);
      else if(gain>=2) out.push(`${bestSan} was stronger. The engine line ${pvToSan(fenBefore, eb.pv, 5)} wins about ${gain} points of material.`);
      else if(!said) out.push(`${bestSan} was better. Engine line: ${pvToSan(fenBefore, eb.pv, 5)}.`);
      else out.push(`Better was ${bestSan}.`);
    }
    if(!out.length) out.push(`This gave away some of ${your} advantage.`);
  }
  if((cls==="blunder"||cls==="mistake") && spent!=null && spent<4) out.push(`${mine?"You":"It was"} played in ${fmtSpent(spent)}. A ten-second blunder check here would have paid off.`);
  else if(clock!=null && clock<60 && (cls==="blunder"||cls==="mistake")) out.push(`With under a minute left, simple and safe beats ambitious.`);
  if(mine && tag && HABIT[tag]) out.push(`Habit to build: ${HABIT[tag]}`);
  return {lines:out, first:out[0]};
}
function explainPly(rv, i){
  const p=rv.plies[i];
  return explainMove({fenBefore:p.fenBefore, uci:p.uci, eb:rv.evals[i], ea:rv.evals[i+1], cls:rv.classes[i], mine:p.mover===rv.side, spent:p.spent, clock:p.clock, tag:(rv.tags[i]||[])[0]});
}

/* a written game review, built from the analysis */
function gameSummary(rv){
  const me=rv.side, opp=me==="w"?"b":"w";
  const mine=rv.plies.map((p,i)=>({p,i,c:rv.classes[i]})).filter(x=>x.p.mover===me);
  const good=[], bad=[], focus=[];
  const accMe=rv.accuracy[me], accOpp=rv.accuracy[opp];
  if(accMe>=accOpp) good.push(`Your accuracy (${accMe}%) beat your opponent's (${accOpp}%).`);
  const bestN=mine.filter(x=>x.c==="best").length; if(bestN) good.push(`You found the engine's top move ${bestN} time${bestN===1?"":"s"} out of ${mine.length}.`);
  const openErr=mine.filter(x=>x.i<20&&(x.c==="mistake"||x.c==="blunder")).length; if(!openErr) good.push("No mistakes in the opening.");
  if(!rv.counts[me].blunder) good.push("No blunders all game.");
  const castled=mine.find(x=>/^O-O/.test(x.p.san)); if(castled && castled.i<24) good.push(`You castled early (move ${castled.p.fenBefore.split(" ")[5]}).`);
  const worst=mine.filter(x=>x.c==="mistake"||x.c==="blunder").sort((a,b)=>b.p.drop-a.p.drop).slice(0,3).sort((a,b)=>a.i-b.i);
  worst.forEach(x=>{ const ex=explainPly(rv,x.i); bad.push({ply:x.i+1, label:`${moveNoLabel(x.p.fenBefore)} ${x.p.san}${CLASS_NAG[x.c]}`, text:ex.first}); });
  const tagCount={}; rv.tags.forEach(ts=>ts.forEach(t=>tagCount[t]=(tagCount[t]||0)+1));
  const topTag=Object.entries(tagCount).sort((a,b)=>b[1]-a[1])[0]?.[0];
  // clock
  const clk=[]; const mineT=mine.filter(x=>x.p.spent!=null);
  if(mineT.length && rv.base){
    const by10=mine.filter(x=>x.i<20&&x.p.clock!=null).pop();
    if(by10){ const used=rv.base-by10.p.clock; clk.push(`Opening: you used ${fmtClock(used)} on your first ${Math.ceil((by10.i+1)/2)} moves${used>150?", more than the 2 minutes to aim for":""}.`); }
    const longest=mineT.slice().sort((a,b)=>b.p.spent-a.p.spent)[0]; clk.push(`Longest think: ${fmtSpent(longest.p.spent)} on ${moveNoLabel(longest.p.fenBefore)} ${longest.p.san}${["mistake","blunder"].includes(longest.c)?", and it was still a "+CLASS_LABEL[longest.c].toLowerCase():""}.`);
    const fast=mineT.filter(x=>x.p.spent<3 && (x.c==="blunder"||x.c==="mistake")).length; if(fast) clk.push(`${fast} of your mistakes came in under 3 seconds. Slow down when pieces are hanging or checks are around.`);
    const end=mine.filter(x=>x.p.clock!=null).pop(); if(end) clk.push(`You finished with ${fmtClock(end.p.clock)} on the clock.`);
  }
  return {good, bad, clk, topTag};
}

function bindBackup(root){
  $("#bkOut",root)?.addEventListener("click",()=>{ try{ const blob=new Blob([JSON.stringify({app:"blunder-check",v:1,at:Date.now(),profile:Store.profile})],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`blunder-check-backup-${dayKey()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); }catch(e){} });
  $("#bkIn",root)?.addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const m=$("#bkMsg"); try{ const d=JSON.parse(String(r.result)); if(d.app!=="blunder-check"||!d.profile||d.profile.v!==1) throw 0; Store.profile=Object.assign(DEFAULT_PROFILE(), d.profile); Store.save(); m.hidden=false; m.textContent="Backup restored."; App.refresh(); }catch(err){ m.hidden=false; m.textContent="That file isn't a Blunder Check backup. Choose the .json file you downloaded."; } }; r.readAsText(f); e.target.value=""; });
}

/* ---------- COACH ---------- */
const Coach = {
  topTags(){ return Object.entries(Store.profile.tags).filter(([t,n])=>n>0&&TAGS[t]).sort((a,b)=>b[1]-a[1]); },
  render(){
    const P=Store.profile, col=$("#coachCol"), games=P.games, real=games.filter(g=>!g.example);
    const top=this.topTags(); const tipTag=top[0]?.[0]||"hanging";
    const day=Math.floor(Date.now()/864e5); const tips=TIPS[tipTag]; const tip=tips[day%tips.length];
    const rec = this.recommended();
    const last10=games.slice(-10);
    const avgAcc=last10.length? Math.round(last10.reduce((s,g)=>s+g.acc,0)/last10.length):null;
    const bpg=last10.length? (last10.reduce((s,g)=>s+(g.counts?.blunder||0),0)/last10.length):null;
    const doneN=LESSONS.filter(l=>P.lessons[l.id]?.done).length;
    const T=Tactics.state();
    const spark = vals => { if(vals.length<2) return ""; const mx=Math.max(...vals,1), mn=Math.min(...vals,0); const pts=vals.map((v,i)=>`${(i/(vals.length-1)*100).toFixed(1)},${(24-((v-mn)/(mx-mn||1))*20-2).toFixed(1)}`); const lp=pts[pts.length-1].split(","); return `<svg viewBox="0 0 100 26" preserveAspectRatio="none"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="1.8" vector-effect="non-scaling-stroke"/><circle cx="${lp[0]}" cy="${lp[1]}" r="2.4" fill="var(--accent)"/></svg>`; };
    const maxT=top[0]?.[1]||1;
    const libs=suggestLessons(3);
    col.innerHTML = `
      <div class="hello"><h1>${games.length? "Your coach" : "Let's find your blunders"}</h1>
        <p>${games.length? `Here's what your reviewed games say about your play. ${real.length? "" : "The numbers below include the example game; review one of your own to make them yours."}` : "Paste a game from Chess.com and I'll go through every move with an engine, show you where it turned, and build your lessons, puzzles and videos around the mistakes you actually make."}</p></div>
      <div class="stats">
        <div class="stat"><b>${T.rating}</b><span>puzzle rating</span>${spark((T.hist||[]).slice(-15))}</div>
        ${games.length? `<div class="stat"><b>${avgAcc}%</b><span>accuracy, last ${last10.length}</span>${spark(last10.map(g=>g.acc))}</div>
        <div class="stat"><b>${bpg.toFixed(1)}</b><span>blunders a game</span>${spark(last10.map(g=>g.counts?.blunder||0))}</div>` :
        `<div class="stat"><b>0</b><span>games reviewed</span></div><div class="stat"><b>${doneN}/${LESSONS.length}</b><span>lessons done</span></div>`}
      </div>
      ${games.length? "" : `<div class="card empty"><h3>Start with a game</h3><p>Review one of your Chess.com games, or try the example to see how it works.</p><div class="row" style="justify-content:center"><a class="btn primary" href="#review">Review a game</a><button class="btn" id="cExample">Try the example</button></div></div>`}
      <div class="tip"><span class="label">Tip for today${top.length? " · "+esc(TAGS[tipTag].name):""}</span><p>${esc(tip)}</p></div>
      ${planHTML()}
      ${(()=>{ const st=currentStage(), S=stageStatus(st); return `<a class="card next" href="#lessons" style="text-decoration:none;color:inherit"><div class="num">${st.n}</div><div style="min-width:0"><span class="label">Road to 1000 · stage ${st.n} of 3</span><h3 style="font-size:18px;margin-top:2px">${esc(st.title)}</h3><p class="muted" style="font-size:13.5px">${S.score}/4 targets met · ${st.from} → ${st.to}</p></div></a>`; })()}
      ${top.length? `<div class="card weak"><div class="row" style="justify-content:space-between"><h3 style="font-size:18px">What's costing you games</h3><span class="note">mistakes &amp; blunders</span></div>
        ${top.map(([t,n])=>`<div class="weak-row"><span><b>${esc(TAGS[t].name)}</b> <span class="muted" style="font-size:13px">· ${esc(TAGS[t].short)}</span></span><span class="n">${n}</span><div class="bar"><i style="width:${Math.max(6,n/maxT*100)}%"></i></div></div>`).join("")}
      </div>`:""}
      ${libs.length? `<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="row" style="justify-content:space-between"><div><h3 style="font-size:18px">Video lessons for you</h3><p class="note" style="margin-top:2px">At your level${top.length?`, aimed at ${esc(TAGS[top[0][0]].name.toLowerCase())}`:""}. ${Library.lessons.length} in the library.</p></div></div><div class="path">${libs.map(libCardHTML).join("")}</div><a class="btn" href="#lessons" id="toLib">Open the library</a></div>`:""}
      ${STANDALONE? (()=>{ const mv=mastersFor(top.length? top.map(t=>t[0]) : ["hanging"],1)[0]; return mv? `<div class="card" style="display:flex;flex-direction:column;gap:10px"><h3 style="font-size:18px">Master class for you</h3>${ytHTML(mv)}</div>`:""; })() : ""}
      ${backupHTML()}
      <p class="foot">Engine: Stockfish 10, running on your device. Puzzles: Lichess open database (CC0). Piece set: Colin M.L. Burnett (CC BY-SA 3.0).</p>`;
    $("#cExample")?.addEventListener("click",()=>{ location.hash="review"; setTimeout(()=>Review.loadExample(),0); });
    bindLib(col); bindPlan(col); bindYT(col); bindBackup(col); $("#toLib")?.addEventListener("click",()=>{ Lessons.tab="library"; Lessons.open=null; });
  },
  recommended(){
    const P=Store.profile, top=this.topTags();
    for(const [t] of top){ const l=LESSONS.find(x=>x.tag===t && !P.lessons[x.id]?.done); if(l) return l; }
    return LESSONS.find(l=>!P.lessons[l.id]?.done)||null;
  }
};

/* ---------- REVIEW ---------- */
const Review = {
  rv:null, ply:0, board:null, ctl:null, showBest:true,
  bindInput(){
    const u=$("#uname"); u.value=Store.profile.username||"";
    u.addEventListener("change",()=>{ Store.profile.username=u.value.trim(); Store.save(); });
    $("#analyseBtn").addEventListener("click",()=>this.start($("#pgn").value));
    $("#exampleBtn").addEventListener("click",()=>this.loadExample());
    $("#pgnFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ $("#pgn").value=String(r.result); this.start(String(r.result)); }; r.readAsText(f); e.target.value=""; });
  },
  loadExample(){ $("#pgn").value=EXAMPLE_PGN; this.start(EXAMPLE_PGN, {example:true}); },
  renderInputSide(){
    $("#uname").value = Store.profile.username||$("#uname").value;
    if(!this.rv && !this.closed && Store.review && Store.review.done){ this.rv=Store.review; this.ply=this.rv.plies.length; }
    const out=$("#reviewOut"), inp=$("#reviewInput");
    if(this.rv){ out.hidden=false; inp.hidden=!!this.rv; this.renderReview(); } else { out.hidden=true; inp.hidden=false; }
    const past=Store.profile.games.slice(-5).reverse();
    $("#pastGames").innerHTML = past.length? `<div class="label" style="margin-bottom:8px">Recently reviewed</div><div class="moments">${past.map(g=>`<div class="moment" style="cursor:default"><span class="san">${g.acc}%</span><span>${esc(g.white)} vs ${esc(g.black)}${g.example?" <span class='muted'>(example)</span>":""}</span><span class="d">${esc(g.result)} · ${g.counts?.blunder||0} blunders</span></div>`).join("")}</div>`:"";
  },
  start(text, {example=false}={}){
    const err=$("#pgnErr"); err.hidden=true;
    if(!text.trim()){ err.textContent="Paste a PGN first, or upload a .pgn file."; err.hidden=false; return; }
    let g; try{ g=parsePGN(text); }catch(e){ err.textContent=e.message||"That doesn't look like a PGN."; err.hidden=false; return; }
    const uname=($("#uname").value||"").trim().toLowerCase();
    let side="w";
    if(example) side="w";
    else if(uname && (g.headers.Black||"").toLowerCase()===uname) side="b";
    else if(uname && (g.headers.White||"").toLowerCase()===uname) side="w";
    else side = null;
    this.ctl?.abort(); this.closed=false; this.orient=null;
    this.rv={id:gameId(text), headers:g.headers, plies:g.plies, base:g.base, side:side||"w", sideKnown:!!side, evals:[], done:false, example};
    this.ply=0; $("#reviewInput").hidden=true; $("#reviewOut").hidden=false;
    this.renderReview(); window.scrollTo(0,0);
    this.analyse();
  },
  async analyse(){
    const rv=this.rv; this.ctl=new AbortController();
    try{ await Engine.ready; }catch(e){ this.renderReview(); return; }
    Engine.setState("busy");
    const ok=await runAnalysis(rv,(i,n)=>{ if(this.rv!==rv) return; const bar=$("#anBar"), t=$("#anTxt"); if(bar) bar.style.width=(i/n*100)+"%"; if(t) t.textContent=`Analysing position ${i} of ${n}`; if(this.ply===i-1||this.ply===i) this.updateBoard(); }, this.ctl.signal);
    Engine.setState("ready");
    if(!ok||this.rv!==rv) return;
    recordGame(rv); Store.review=rv; Store.save(true);
    const firstBad=rv.plies.findIndex((p,i)=>p.mover===rv.side&&(rv.classes[i]==="blunder"||rv.classes[i]==="mistake"));
    this.ply = firstBad>=0? firstBad+1 : 0;
    this.renderReview(); App.refresh();
  },
  setSide(s){ const rv=this.rv; if(!rv) return; rv.side=s; rv.sideKnown=true; if(rv.done){ const wasRecorded=Store.profile.games.find(g=>g.id===rv.id); if(wasRecorded){ /* undo previous record */ const P=Store.profile; Object.entries(wasRecorded.tags||{}).forEach(([t,n])=>{ P.tags[t]=Math.max(0,(P.tags[t]||0)-n); }); P.games=P.games.filter(g=>g.id!==rv.id); P.drills=P.drills.filter(d=>!d.id.startsWith(rv.id+"-")); } finishAnalysis(rv); recordGame(rv); Store.review=rv; Store.save(true); } this.renderReview(); App.refresh(); },
  renderReview(){
    const rv=this.rv, out=$("#reviewOut"); if(!rv) return;
    const H=rv.headers, me=rv.side, opp=me==="w"?"b":"w";
    const name=s=> s==="w"?(H.White||"White"):(H.Black||"Black");
    const engFail=Engine.state==="failed";
    const n=rv.plies.length;
    out.innerHTML = `
      <div class="rev">
        <div class="boardcol">
          <div class="row" style="justify-content:space-between"><button class="btn small ghost back" id="newGame">← New game</button><button class="btn small ghost" id="flip">Flip board</button></div>
          <div class="players" id="pTop"></div>
          <div class="evalbar" id="evalbar"><i></i><b class="l"></b><b class="r"></b></div>
          <div id="board"></div>
          <div class="players" id="pBot"></div>
          <div class="nav"><button class="btn" data-n="first" aria-label="First move">|‹</button><button class="btn" data-n="prev" aria-label="Previous move">‹</button><button class="btn" data-n="next" aria-label="Next move">›</button><button class="btn" data-n="last" aria-label="Last move">›|</button></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
          ${!rv.sideKnown? `<div class="card row" style="justify-content:space-between"><span><b>Which side were you?</b> <span class="muted">Add your username above next time and I'll detect it.</span></span><div class="seg"><button data-side="w" aria-pressed="${me==="w"}">White</button><button data-side="b" aria-pressed="${me==="b"}">Black</button></div></div>`:""}
          ${engFail? `<div class="card"><p class="err">The chess engine couldn't start in this browser, so moves can't be scored. Lessons and the coach still work.</p></div>` :
           !rv.done? `<div class="card" style="display:flex;flex-direction:column;gap:8px"><b id="anTxt">Starting the engine…</b><div class="progress"><i id="anBar"></i></div><p class="note">Every position is checked on your device. About a minute for a full game. You can step through moves while it runs.</p></div>` :
           `<div class="summary">
              <div class="card acc you"><span class="label">You · ${esc(name(me))}</span><b>${rv.accuracy[me]}%</b><div class="counts">${["blunder","mistake","inacc"].map(k=>`<span class="tag ${k}">${rv.counts[me][k]} ${k==="inacc"?"inacc.":k+(rv.counts[me][k]===1?"":"s")}</span>`).join("")}</div></div>
              <div class="card acc"><span class="label">Opponent · ${esc(name(opp))}</span><b>${rv.accuracy[opp]}%</b><div class="counts">${["blunder","mistake","inacc"].map(k=>`<span class="tag ${k}">${rv.counts[opp][k]} ${k==="inacc"?"inacc.":k+(rv.counts[opp][k]===1?"":"s")}</span>`).join("")}</div></div>
            </div>
            <div class="card" style="padding:12px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="label">Evaluation · tap to jump</span><span class="note">${esc(H.Result||"")} ${H.Termination?"· "+esc(H.Termination):""}</span></div><svg class="graph" id="graph" viewBox="0 0 300 84" preserveAspectRatio="none"></svg></div>`}
          <div class="card mvinfo" id="mvinfo"></div>
          ${rv.done? this.momentsHTML():""}
          ${rv.done? this.summaryHTML():""}
          <div class="card" style="padding:8px"><div class="label" style="padding:6px 8px">Scoresheet</div><div class="sheet" id="sheet"></div></div>
        </div>
      </div>`;
    this.board=new Board($("#board"),{orientation:this.orient||me});
    $("#newGame").addEventListener("click",()=>{ this.ctl?.abort(); if(Engine.state==="busy") Engine.setState("ready"); this.rv=null; this.closed=true; this.orient=null; this.board=null; this.renderInputSide(); window.scrollTo(0,0); });
    $("#flip").addEventListener("click",()=>{ this.orient=this.board.orientation==="w"?"b":"w"; this.board.setOrientation(this.orient); this.updateBoard(); });
    $$(".nav button",out).forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.n; this.go(k==="first"?0:k==="last"?n:k==="prev"?this.ply-1:this.ply+1); }));
    $$("[data-side]",out).forEach(b=>b.addEventListener("click",()=>this.setSide(b.dataset.side)));
    $$(".moment[data-ply]",out).forEach(b=>b.addEventListener("click",()=>{ this.go(+b.dataset.ply); if(innerWidth<900) $("#board").scrollIntoView({behavior:"smooth",block:"center"}); }));
    $$("[data-jump]",out).forEach(b=>b.addEventListener("click",()=>{ this.go(+b.dataset.jump); if(innerWidth<900) $("#board").scrollIntoView({behavior:"smooth",block:"center"}); }));
    bindLib(out);
    $("#goLesson")?.addEventListener("click",e=>{ Lessons.open=e.currentTarget.dataset.l; location.hash="lessons"; });
    const g=$("#graph"); if(g){ this.drawGraph(); g.addEventListener("click",e=>{ const r=g.getBoundingClientRect(); this.go(Math.round((e.clientX-r.left)/r.width*n)); }); }
    this.renderSheet(); this.updateBoard();
  },
  momentsHTML(){
    const rv=this.rv; const list=rv.plies.map((p,i)=>({p,i,c:rv.classes[i]})).filter(x=>x.p.mover===rv.side&&(x.c==="blunder"||x.c==="mistake"));
    if(!list.length) return `<div class="card"><h3 style="font-size:18px">Key moments</h3><p class="muted" style="margin-top:6px">No mistakes or blunders from you in this game. Nice.</p></div>`;
    return `<div class="card" style="display:flex;flex-direction:column;gap:10px"><h3 style="font-size:18px">Your key moments</h3><div class="moments">${list.map(x=>`<button class="moment" data-ply="${x.i+1}"><span class="tag ${x.c}">${CLASS_NAG[x.c]}</span><span class="san">${moveNoLabel(x.p.fenBefore)} ${esc(x.p.san)}</span><span class="d">${esc((rv.tags[x.i]||[]).map(t=>TAGS[t]?.name).join(" · "))}<br>best ${esc(uciToSan(x.p.fenBefore,rv.evals[x.i].best))}</span></button>`).join("")}</div></div>`;
  },
  renderSheet(){
    const rv=this.rv, rows=[]; const pl=rv.plies;
    const startBlack = turnOf(pl[0].fenBefore)==="b";
    let i=0; let no=+pl[0].fenBefore.split(" ")[5];
    const cell=(k)=>{ if(k==null||k>=pl.length) return `<td></td>`; const p=pl[k], c=rv.classes?.[k]; return `<td><button class="mv${p.mover===rv.side?" mine":""}${this.ply===k+1?" cur":""}" data-k="${k+1}">${esc(p.san)}${c?`<span style="color:var(--c-${c==="inacc"?"inacc":c})">${CLASS_NAG[c]}</span>`:""}<span class="t">${fmtSpent(p.spent)}</span></button></td>`; };
    if(startBlack){ rows.push(`<tr><td class="no">${no}.</td><td></td>${cell(0)}</tr>`); i=1; no++; }
    for(;i<pl.length;i+=2,no++) rows.push(`<tr><td class="no">${no}.</td>${cell(i)}${cell(i+1)}</tr>`);
    $("#sheet").innerHTML=`<table>${rows.join("")}</table>`;
    $$("#sheet .mv").forEach(b=>b.addEventListener("click",()=>this.go(+b.dataset.k)));
  },
  drawGraph(){
    const rv=this.rv, g=$("#graph"); if(!g||!rv.done) return;
    const n=rv.evals.length-1, W=300, H=84, y=wc=>H/2 - wc*(H/2-3);
    const pts=rv.evals.map((e,i)=>[i/n*W, y(e.wc)]);
    const area=`M0 ${H/2} `+pts.map(p=>`L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ")+` L${W} ${H/2} Z`;
    const marks=rv.plies.map((p,i)=>({p,i,c:rv.classes[i]})).filter(x=>x.c==="blunder"||x.c==="mistake").map(x=>`<circle cx="${((x.i+1)/n*W).toFixed(1)}" cy="${y(rv.evals[x.i+1].wc).toFixed(1)}" r="${x.p.mover===rv.side?3.6:2.4}" fill="var(--c-${x.c})" stroke="var(--surface)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join("");
    const cx=(this.ply/n*W).toFixed(1);
    g.innerHTML=`<rect x="0" y="0" width="${W}" height="${H}" fill="var(--bbar)"/><path d="M0 ${H} L0 ${H/2} ${pts.map(p=>`L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ")} L${W} ${H/2} L${W} ${H} Z" fill="var(--wbar)"/><line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--c-good)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/><line id="gcur" x1="${cx}" x2="${cx}" y1="0" y2="${H}" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>${marks}`;
  },
  go(k){ const n=this.rv.plies.length; this.ply=Math.max(0,Math.min(n,k)); this.updateBoard(); },
  updateBoard(){
    const rv=this.rv; if(!rv||!this.board) return; const k=this.ply, n=rv.plies.length;
    const fen = k===0? rv.plies[0].fenBefore : rv.plies[k-1].fenAfter;
    const p = k>0? rv.plies[k-1] : null;
    const evNow=rv.evals[k], evPrev=k>0?rv.evals[k-1]:null;
    const arrows=[]; if(p && rv.done && evPrev?.best && evPrev.best!==p.uci && ["inacc","mistake","blunder"].includes(rv.classes[k-1])) arrows.push(evPrev.best);
    this.board.set(fen,{last:p?[p.from,p.to]:null, arrows});
    // eval bar
    const bar=$("#evalbar"); if(bar){ const wc=evNow?evNow.wc:0; bar.querySelector("i").style.width=(50+50*wc)+"%"; const d=evNow?evalDisp(evNow):"…"; bar.querySelector(".l").textContent= wc>=0? d:""; bar.querySelector(".r").textContent= wc<0? d:""; }
    // players & clocks
    const H=rv.headers; const clockAt=s=>{ for(let j=k-1;j>=0;j--) if(rv.plies[j].mover===s && rv.plies[j].clock!=null) return rv.plies[j].clock; return rv.base; };
    const bottom=this.board.orientation, top=bottom==="w"?"b":"w";
    const lbl=s=>`<span>${s===rv.side?"● ":""}${esc(s==="w"?(H.White||"White"):(H.Black||"Black"))}${(s==="w"?H.WhiteElo:H.BlackElo)?` <span class="muted">(${esc(s==="w"?H.WhiteElo:H.BlackElo)})</span>`:""}</span>${clockAt(s)!=null?`<span class="clk">${fmtClock(clockAt(s))}</span>`:""}`;
    $("#pTop").innerHTML=lbl(top); $("#pBot").innerHTML=lbl(bottom);
    // info
    const info=$("#mvinfo");
    if(!p){ info.innerHTML=`<span class="label">Start position</span><p class="muted">Use the arrows or tap a move on the scoresheet. ${rv.done?"Coloured dots mark inaccuracies, mistakes and blunders.":""}</p>`; }
    else {
      const c=rv.classes?.[k-1]; const mine=p.mover===rv.side;
      const bestSan = evPrev?.best? uciToSan(p.fenBefore, evPrev.best) : null;
      const pov = s => evalDisp({...s, cp: s.cp, mate:s.mate});
      info.innerHTML = `
        <div class="mvhead"><span class="label">${moveNoLabel(p.fenBefore)} · ${mine?"You":"Opponent"}</span></div>
        <div class="mvhead"><span class="san">${esc(p.san)}</span>${c? `<span class="tag ${c}">${CLASS_NAG[c]?CLASS_NAG[c]+" ":""}${CLASS_LABEL[c]}</span>`:""}${p.spent!=null?`<span class="note mono">${fmtSpent(p.spent)} used${p.clock!=null?` · ${fmtClock(p.clock)} left`:""}</span>`:""}</div>
        ${rv.done&&evPrev? `<p class="mono" style="font-size:13.5px">Eval ${esc(pov(evPrev))} → ${esc(pov(evNow))}${bestSan&&c!=="best"?` · Best was <b>${esc(bestSan)}</b>`:""}</p>
          ${c!=="best"&&c!=="good"&&evPrev.pv?.length? `<p class="note mono">Engine line: ${esc(pvToSan(p.fenBefore, evPrev.pv, 6))}</p>`:""}
          ${(rv.tags[k-1]||[]).length? `<p class="note">${(rv.tags[k-1]).map(t=>esc(TAGS[t].name)).join(" · ")}</p>`:""}
          <div class="explain">${explainPly(rv,k-1).lines.map(t=>`<p>${esc(t)}</p>`).join("")}</div>` : (rv.done?"":`<p class="note">Waiting for the engine…</p>`)}`;
    }
    $$("#sheet .mv").forEach(b=>b.classList.toggle("cur", +b.dataset.k===k));
    const gl=$("#gcur"); if(gl){ const x=(k/n*300).toFixed(1); gl.setAttribute("x1",x); gl.setAttribute("x2",x); }
  },
  summaryHTML(){
    const rv=this.rv, S=gameSummary(rv); const lesson=S.topTag? LESSONS.find(l=>l.tag===S.topTag) : null; const vid=S.topTag? suggestLessons(1, tagKinds(S.topTag))[0] : null;
    return `<div class="card" style="display:flex;flex-direction:column;gap:12px"><h3 style="font-size:18px">Coach's review</h3>

      ${S.bad.length? `<div><div class="label">What cost you</div><div class="moments" style="margin-top:6px">${S.bad.map(x=>`<button class="moment" data-jump="${x.ply}" style="flex-direction:column;align-items:flex-start;gap:3px"><span class="san">${esc(x.label)}</span><span style="font-size:13.5px">${esc(x.text)}</span></button>`).join("")}</div></div>`:""}
      ${S.clk.length? `<div><div class="label">Your clock</div><ul class="prose" style="padding-left:20px;margin:6px 0 0">${S.clk.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}

};

/* ---------- PUZZLE RUNNER ---------- */
function mountPuzzle(el, cfg){
  // cfg: {fen, pre (opponent move played first), line[], accept[], prompt, hint, hintSq, solved, engineCheck:{wcBefore}, onSolved, onFirstWrong, onReveal, label}
  let fen=cfg.fen; if(cfg.pre){ const c=new Chess(fen); }
  const side = cfg.pre? (turnOf(fen)==="w"?"b":"w") : turnOf(fen);
  let step=0, wrong=0, done=false, hinted=false;
  el.innerHTML=`<div class="ptitle"><span class="turn"><i class="${side}"></i>${side==="w"?"White":"Black"} to move</span><span class="note mono">${esc(cfg.label||"")}</span></div>
    ${cfg.prompt?`<p style="font-weight:600">${esc(cfg.prompt)}</p>`:""}<div class="pb"></div><div class="fb" hidden></div><div class="row pbtns"></div>`;
  const fb=$(".fb",el), btns=$(".pbtns",el);
  const board=new Board($(".pb",el),{interactive:!cfg.pre, side, orientation:side, onMove:(f,t)=>tryMove(f,t)});
  board.set(fen,{animate:false});
  if(cfg.pre){ setTimeout(()=>{ const m=moveObj(fen,cfg.pre); if(m){ fen=m.after; board.set(fen,{last:[cfg.pre.slice(0,2),cfg.pre.slice(2,4)]}); } board.setInteractive(true); }, 650); }
  const say=(t,cls)=>{ fb.hidden=false; fb.className="fb "+(cls||""); fb.innerHTML=t; };
  const setBtns=()=>{
    btns.innerHTML = done? (cfg.after||"") : `${(cfg.hint||cfg.hintSq)&&!hinted?`<button class="btn small" data-a="hint">Hint</button>`:""}${wrong>=1||hinted?`<button class="btn small ghost" data-a="show">Show answer</button>`:""}`;
    $$("button[data-a]",btns).forEach(b=>b.addEventListener("click",()=>{ if(b.dataset.a==="hint"){ hinted=true; if(cfg.hintSq) board.showHint(cfg.line[step].slice(0,2)); if(cfg.hint) say(esc(cfg.hint),""); cfg.onFirstWrong&&!wrong&&cfg.onFirstWrong("hint"); setBtns(); } else if(b.dataset.a==="show") reveal(); }));
    cfg.onButtons&&cfg.onButtons(btns, done);
  };
  async function tryMove(from,to){
    if(done) return;
    const c=new Chess(fen); const mv=c.move({from,to,promotion:"q"}); if(!mv) return;
    const uci=from+to+(mv.promotion||"");
    const expected=cfg.line[step];
    let ok = uci===expected || (step===0 && (cfg.accept||[]).includes(uci)) || c.in_checkmate();
    board.set(c.fen(),{last:[from,to]});
    if(!ok && cfg.engineCheck && step===0 && Engine.state!=="failed"){
      board.locked=true; say("Checking your move…","");
      try{ await Engine.ready; const ev=await evaluate(c.fen(),{depth:12, movetime:900}); const drop=cfg.engineCheck.wcBefore - sideWc(ev, side); if(drop<0.08) ok="alt"; }catch(e){}
      board.locked=false;
    }
    if(ok){
      fen=c.fen(); step++;
      if(c.in_checkmate() || step>=cfg.line.length) return finish(ok);
      board.locked=true; say("Good. Keep going.","good"); await sleep(450);
      const r=cfg.line[step]; const m2=moveObj(fen,r); if(m2){ fen=m2.after; board.set(fen,{last:[r.slice(0,2),r.slice(2,4)]}); } step++; board.locked=false;
      if(step>=cfg.line.length) finish(ok);
    } else {
      wrong++; board.flash("✕"); say(wrong===1? "Not that one. Take another look." : "Still not it.","bad");
      if(wrong===1 && !hinted) cfg.onFirstWrong&&cfg.onFirstWrong("wrong");
      board.locked=true; await sleep(650); board.locked=false; board.set(fen,{animate:false}); setBtns();
    }
  }
  function finish(ok){ done=true; board.setInteractive(false); board.flash("✓"); say((ok==="alt"? "That works too. " : "") + (cfg.solved||"Solved."), "good"); setBtns(); cfg.onSolved&&cfg.onSolved(wrong, hinted); }
  function reveal(){
    done=true; board.setInteractive(false);
    const u=cfg.line[step]; const m=moveObj(fen,u);
    board.set(fen,{arrows:[u], animate:false});
    const rest = pvToSan(fen, cfg.line.slice(step), 7);
    say(`The answer is <b class="mono">${esc(m?m.m.san:u)}</b>${cfg.line.length-step>1?` <span class="mono note">(${esc(rest)})</span>`:""}. ${esc(cfg.solved||"")}`,""); setBtns(); cfg.onReveal&&cfg.onReveal();
  }
  setBtns();
  return board;
}
function mountChoice(el, pz, txt, onSolved){
  const side=turnOf(pz.fen);
  el.innerHTML=`<div class="ptitle"><span class="turn"><i class="${side}"></i>${side==="w"?"White":"Black"} to move</span></div><p style="font-weight:600">${esc(txt.prompt)}</p><div class="pb"></div><div class="opts">${pz.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div><div class="fb" hidden></div>`;
  const board=new Board($(".pb",el),{orientation:side}); board.set(pz.fen,{animate:false});
  let solved=false, wrong=0;
  $$(".opt",el).forEach(b=>b.addEventListener("click",()=>{
    if(solved) return; const i=+b.dataset.i; const fb=$(".fb",el); fb.hidden=false;
    const c=new Chess(pz.fen); const m=c.move(pz.options[i],{sloppy:true});
    if(i===pz.correct){ solved=true; b.classList.add("right"); fb.className="fb good"; fb.textContent=txt.why[i]; if(m) board.set(c.fen(),{last:[m.from,m.to]}); onSolved&&onSolved(wrong); }
    else { wrong++; b.classList.add("wrong"); fb.className="fb bad"; fb.textContent=txt.why[i]; if(m) board.set(pz.fen,{arrows:[m.from+m.to], animate:false}); }
  }));
}

/* ---------- TACTICS TRAINER ---------- */
const Tactics = {
  theme:"foryou", cur:null,
  state(){ const P=Store.profile; P.tactics=P.tactics||{rating:400, n:0, solved:0, failed:0, streak:0, best:0, recent:[], hist:[400], day:0, today:0}; const T=P.tactics; const d=Math.floor((Date.now()+10*36e5)/864e5); if(T.day!==d){ T.day=d; T.today=0; } return T; },
  pick(){
    const T=this.state(); const recent=new Set(T.recent);
    let themes=null;
    if(this.theme==="foryou"){ const top=Coach.topTags()[0]?.[0]; if(top && Math.random()<0.7) themes=TAG_THEMES[top]; }
    else if(this.theme!=="mixed") themes=[this.theme];
    let pool=[]; for(let w=120; w<=1200 && pool.length<8; w+=120){ pool=TACTICS.filter(p=>!recent.has(p[0]) && Math.abs(p[3]-T.rating)<=w && (!themes || themes.some(t=>p[4].split("|").includes(t)))); }
    if(!pool.length) pool=TACTICS.filter(p=>!recent.has(p[0]));
    if(!pool.length){ T.recent=[]; pool=TACTICS; }
    return pool[Math.floor(Math.random()*pool.length)];
  },
  next(){ this.cur={p:this.pick(), result:null, delta:0}; this.render(); },
  grade(win){
    const T=this.state(), c=this.cur; if(c.result) return; c.result=win?"solved":"failed";
    const exp=1/(1+Math.pow(10,(c.p[3]-T.rating)/400)); const K=T.n<20?40:24;
    const d=Math.round(K*((win?1:0)-exp)); c.delta=d; T.rating=Math.max(100,T.rating+d); T.n++;
    if(win){ T.solved++; T.streak++; T.best=Math.max(T.best,T.streak); } else { T.failed++; T.streak=0; }
    T.today=(T.today||0)+1; logEvent("p");
    T.hist=(T.hist||[]).concat(T.rating).slice(-40); T.recent=(T.recent||[]).concat(c.p[0]).slice(-400);
    Store.save(); this.renderHead();
  },
  renderHead(){
    const T=this.state(), c=this.cur, h=$("#tHead"); if(!h) return;
    h.innerHTML=`<div class="rating"><span class="label">Puzzle rating</span><div><b>${T.rating}</b>${c&&c.result?`<span class="delta ${c.delta>=0?"up":"down"}">${c.delta>=0?"+":""}${c.delta}</span>`:""}</div></div>
      <div class="mini"><span>Today <b>${T.today||0}</b></span><span>Streak <b>${T.streak}</b></span><span>Solved <b>${T.solved}</b>/${T.n}</span></div>`;
  },
  render(){
    const col=$("#puzzlesCol"); this.state();
    if(!this.cur) { this.cur={p:this.pick(), result:null, delta:0}; }
    const p=this.cur.p, themes=p[4].split("|");
    const top=Coach.topTags()[0]?.[0];
    col.innerHTML=`<div><h2 style="font-size:26px;font-weight:800">Tactics</h2><p class="muted" style="margin-top:4px">Real positions from games, matched to your rating. Your opponent moves first, then find the best reply.</p></div>
      <div class="card trow" id="tHead"></div>
      <div class="chips" role="group" aria-label="Puzzle theme">${Object.entries(THEMES).map(([k,v])=>`<button class="chip" data-t="${k}" aria-pressed="${this.theme===k}">${esc(v.name)}${k==="foryou"&&top?` · ${esc(TAGS[top].name)}`:""}</button>`).join("")}</div>
      <div class="card puzzle" id="tBox"></div>
      <p class="note">Puzzle ${esc(p[0])} · rated ${p[3]} · ${themes.map(t=>esc(THEMES[t]?.name||t)).join(", ")} · <a href="https://lichess.org/training/${esc(p[0])}" target="_blank" rel="noopener" style="color:var(--accent)">open on Lichess ↗</a></p>`;
    this.renderHead();
    $$(".chip[data-t]",col).forEach(b=>b.addEventListener("click",()=>{ this.theme=b.dataset.t; this.next(); }));
    const ms=p[2].split(" ");
    const mainTheme=themes.find(t=>THEMES[t]?.hint)||"material";
    const goal = themes.includes("mate1")?"Find checkmate in one.": themes.includes("mate")||themes.includes("backRank")?"Find the checkmate.":"Find the best move.";
    mountPuzzle($("#tBox"),{fen:p[1], pre:ms[0], line:ms.slice(1), prompt:goal, hint:THEMES[mainTheme].hint, hintSq:true, solved:this.cur.result==="failed"?"Solved, but it counts as a miss because you needed help. Next one!":"Solved!",
      label:`Rated ${p[3]}`,
      onFirstWrong:()=>this.grade(false),
      onSolved:(w,h)=>{ if(!w && !h) this.grade(true); else this.grade(false); },
      onReveal:()=>this.grade(false),
      after:`<button class="btn primary" data-n="1">Next puzzle →</button>`,
      onButtons:(b,done)=>{ $("[data-n]",b)?.addEventListener("click",()=>{ this.next(); window.scrollTo({top:0}); }); if(!done){ const s=document.createElement("button"); s.className="btn small ghost"; s.textContent="Skip"; s.addEventListener("click",()=>{ if(!this.cur.result) this.grade(false); this.next(); }); b.appendChild(s); } }
    });
  }
};
